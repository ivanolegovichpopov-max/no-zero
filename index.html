<style>html,body{margin:0;background:#22302f;height:100%}.ldr{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;box-sizing:border-box}.ldr-t{font:800 26px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.18em;color:#f2c46d}.ldr-bar{width:min(240px,70vw);height:8px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}.ldr-bar i{display:block;height:100%;width:4%;border-radius:6px;background:linear-gradient(90deg,#f2c46d,#ffe2a3);transition:width .25s ease-out}.ldr-s{font:500 13px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;color:rgba(255,255,255,.55)}</style></head><body><div class="ldr"><div class="ldr-t">NO ZERO</div><div class="ldr-bar"><i id="b"></i></div><div class="ldr-s">Загружаем игру…</div></div><script>(function(){var q=location.search?location.search+"&":"?",u="app.html"+q+"v="+Date.now(),bar=document.getElementById("b"),SIZE=950459;function show(h){document.open();document.write(h);document.close()}function net(){return fetch(u,{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;if(!r.body||!window.TextDecoder)return r.text();var rd=r.body.getReader(),dec=new TextDecoder(),got=0,parts=[];return (function pump(){return rd.read().then(function(x){if(x.done){parts.push(dec.decode());return parts.join("")}got+=x.value.length;parts.push(dec.decode(x.value,{stream:true}));bar.style.width=Math.min(35,4+31*got/SIZE)+"%";return pump()})})()}).then(function(h){try{if(window.caches)caches.open("nz-app").then(function(c){c.put("app.html",new Response(h,{headers:{"content-type":"text/html; charset=utf-8"}}))})}catch(e){}return h})}var cached=window.caches?caches.open("nz-app").then(function(c){return c.match("app.html")}).then(function(r){return r?r.text():null}).catch(function(){return null}):Promise.resolve(null);cached.then(function(h){if(h){bar.style.width="35%";return h}return net()}).then(show).catch(function(){location.replace(u+location.hash)})})();</script></body>
