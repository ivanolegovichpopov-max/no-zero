rtant}/* одно правило переходов поля: раньше это правило затирало переход масштаба (приближение при ожидании тории) — поле возвращалось рывком */#board{transition:background .8s,border-color .8s,box-shadow .4s,scale 1.1s cubic-bezier(.3,0,.2,1),height .8s cubic-bezier(.3,.75,.25,1),width .8s cubic-bezier(.3,.75,.25,1)}/* верх в бонусе не двигается: строка «спин · итого» занимает ровно место строки «6 × 5 · MAX», поле начинается там же */body.fs .sub{margin-top:12px !important;height:26px !important;min-height:26px !important;padding-top:0 !important;padding-bottom:0 !important;box-sizing:border-box}body.fs #boardWrap{margin-top:10px !important}/* строка «спин · счётчики · итого» в бонусе всегда влезает: счётчики сжимаются, итог не уезжает за край */body.fs .sub{gap:8px !important}body.fs .sub #subR{flex:0 0 auto}body.fs .sub #subL{flex:0 1 auto;min-width:0}/* шкала спинов — между «спин N / M» и счётчиками, всегда видна; счётчики — справа, без растягивания */body.fs.tmOn .sub .meters,body.fs.cmOn .sub .meters{min-width:0;overflow:hidden;flex:0 1 auto !important;justify-content:flex-end}/* строка бонуса — три колонки: «спин N / M» слева, шкала строго по центру (фиксированная ширина), счётчики справа.Всё выровнено по центру по вертикали; счётчики компактные, поэтому влезают целиком и шкалу не задевают */body.fs .sub{display:grid !important;grid-template-columns:1fr 40% 1fr;align-items:center !important;column-gap:10px}body.fs .sub #subL{justify-self:start;line-height:1}body.fs .sub .fsprog{position:relative;width:100%;transform:none;left:auto;top:auto;align-self:center;grid-column:2;grid-row:1}/* тории и ромбики каскада встают на место шкалы, по центру; шкала на это время прячется */body.fs.tmOn .sub .fsprog,body.fs.cmOn .sub .fsprog{visibility:hidden}body.fs.tmOn .sub .meters,body.fs.cmOn .sub .meters{grid-column:2;grid-row:1;justify-self:center;gap:7px !important;max-width:none !important;overflow:visible !important;flex:none !important}body.fs .sub .tmeter{gap:4px !important}body.fs .sub .tmeter i{width:15px !important;height:13px !important}body.fs .sub .cmeter{gap:4px !important}body.fs .sub .cmeter i{width:9px !important;height:9px !important}body.fs.tmOn.cmOn .sub .meters::before{height:11px}body.fs.tmOn .sub .tmeter,body.fs.cmOn .sub .cmeter{animation:mtrIn .35s ease-out}@keyframes mtrIn{from{opacity:0;transform:scale(.85)}}/* на красной луне шкала должна читаться: светлая основа, белая заливка */body.fs .fsprog::before{background:rgba(255,255,255,.5)}body.fs .fsprog .fl{background:#fff;box-shadow:none}body.fs .fsprog .tk{background-image:linear-gradient(90deg,rgba(255,255,255,.6) 0,rgba(255,255,255,.6) 1px,transparent 1px);border-right-color:rgba(255,255,255,.6)}body.fs .sub .meters i,body.fs .sub .meters svg{flex-shrink:1}/* бонус: итог внизу справа, напротив выигрыша фриспина; вверху — только спины и счётчики */.fstot{display:none}body.fs .fstot{display:flex;flex-direction:column;align-items:flex-end;gap:0}body.fs .fstot .lbl{color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;line-height:1.3}body.fs .fstot b{font-family:'Shippori Mincho B1',serif;font-size:30px;font-weight:800;line-height:1.1;color:#FF4650;font-variant-numeric:tabular-nums}body.fs .fstot.up b{animation:omHit .6s ease-out}body.fs .sub #subR{display:none !important}body.fs .wgoal span{right:auto;left:50%;transform:translateX(-50%)}.wgoal{display:none !important}/* деления шкалы — отдельные штрихи, позиции задаёт скрипт в целых пикселях экрана */.fsprog .tk b{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.6)}/* след ушедшей луны: едва заметное прерывистое кольцо кистью, без числа — отпечаток, а не вернувшаяся луна */#app .orb.spent circle:first-of-type{fill:transparent !important;stroke:rgba(255,70,80,.24) !important;stroke-width:1.3 !important;stroke-dasharray:46 5 22 4 31 6;stroke-linecap:round}#app .orb.spent circle:nth-of-type(2){stroke:transparent !important}#app .orb.spent text{di
