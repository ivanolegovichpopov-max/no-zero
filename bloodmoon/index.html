svg{display:block;width:100%;height:100%;overflow:visible}.bsplat svg{transform-origin:50% 35%;animation:splatIn .18s cubic-bezier(.2,1.5,.4,1) both}.bsplat .sat{animation:satOut .22s cubic-bezier(.1,.7,.3,1) both}.bsplat .drip{stroke-dasharray:1;stroke-dashoffset:1;animation:dripDraw 1.9s cubic-bezier(.45,0,.55,1) both}.bsplat .dripEnd{opacity:0;animation:dripEnd .25s ease-out both}@keyframes dripDraw{to{stroke-dashoffset:0}}@keyframes dripEnd{to{opacity:1}}.frozen .drip{stroke-dashoffset:0}.frozen .dripEnd{opacity:1}.bsplat .hl{animation:hlFade 2.6s ease-out forwards}@keyframes splatIn{0%{transform:scale(.15)}100%{transform:scale(1)}}@keyframes satOut{0%{transform:translate(calc(var(--dx) * -1),calc(var(--dy) * -1)) scale(.4);opacity:0}30%{opacity:1}100%{transform:none;opacity:1}}@keyframes drip{0%{transform:scaleY(0)}100%{transform:scaleY(1)}}@keyframes hlFade{0%{opacity:.38}100%{opacity:0}}@keyframes dryBase{0%{opacity:1;filter:none}60%{opacity:.95;filter:brightness(.75) saturate(.85)}100%{opacity:0;filter:brightness(.6) saturate(.7)}}@keyframes dryKeep{0%{opacity:1;filter:none}100%{opacity:.42;filter:brightness(.55) saturate(.65)}}.bspray{position:absolute;z-index:6;pointer-events:none;transform-origin:0 50%;animation:dryBase 4.2s linear forwards}.bspray.keep{animation:dryKeep 8s cubic-bezier(.2,.6,.3,1) forwards}.bspray svg{display:block;overflow:visible}.bspray .sw{clip-path:inset(-20px 100% -20px 0);-webkit-clip-path:inset(-20px 100% -20px 0);animation:sprayIn .2s cubic-bezier(.1,.6,.3,1) forwards}@keyframes sprayIn{to{clip-path:inset(-20px -5% -20px 0);-webkit-clip-path:inset(-20px -5% -20px 0)}}.bridge{position:absolute;z-index:7;pointer-events:none;transform-origin:center;opacity:0;animation:bridgeIn .2s cubic-bezier(.2,.8,.3,1) forwards,bridgeOut .48s cubic-bezier(.45,0,.8,.6) forwards}.bridge svg{display:block}@keyframes bridgeIn{from{opacity:0;clip-path:inset(0 50% 0 50%)}to{opacity:1;clip-path:inset(0 0 0 0)}}@keyframes bridgeOut{0%{opacity:1;filter:blur(0)}35%{filter:blur(1.2px)}100%{opacity:0;filter:blur(8px)}}.bsplat.bsmall{z-index:8;animation:dryBase 1.9s linear forwards}.mini div svg{width:26px;height:26px;display:block}.mini div.w{color:#fff}@keyframes meltAway{0%{opacity:1;filter:blur(0)}35%{opacity:1;filter:blur(1.2px)}100%{opacity:0;filter:blur(8px)}}@keyframes blotGrow{0%{opacity:1;transform:scale(.1) rotate(var(--rot))}100%{opacity:1;transform:scale(1.05) rotate(calc(var(--rot) + 6deg))}}/* кровь обычной игры: подсыхает и бледнеет до следующего спина */@keyframes dryIdle{0%{opacity:1;filter:none}17%{opacity:.96;filter:brightness(.75) saturate(.85)}100%{opacity:.62;filter:brightness(.55) saturate(.65)}}.bsplat.idle:not(.bsmall),.bspray.idle{animation:dryIdle 24s cubic-bezier(.15,.6,.3,1) forwards}.stain.idle{animation:stainIn .25s ease-out forwards,dryIdle 24s .25s cubic-bezier(.15,.6,.3,1) forwards}@keyframes stainIn{0%{opacity:0;transform:scale(.3)}100%{opacity:.85;transform:scale(1)}}.washbox{position:absolute;inset:0;pointer-events:none;z-index:8;clip-path:inset(-400px -400px 0 -400px);-webkit-clip-path:inset(-400px -400px 0 -400px)}.washcol{position:absolute;inset:0;pointer-events:none}.frozen,.frozen *{animation:none !important}.frozen .hl{opacity:0}.frozen .sw{clip-path:none !important;-webkit-clip-path:none !important}.pool{position:absolute;inset:0;pointer-events:none;z-index:8;animation:dryIdle 24s cubic-bezier(.15,.6,.3,1) forwards}.pool .pin{position:absolute;inset:0;opacity:.72}/* кровь может стекать за нижний край поля поверх строки выигрыша */#boardWrap{z-index:2}/* азарт: сердце луны, наезд на замедленные барабаны, нагрев каскада */#app .orb.wait{animation:orbBeat var(--pace,1s) ease-in-out infinite !important;filter:drop-shadow(0 0 calc(4px + 10px * var(--heat,0)) rgba(255,40,50,.75))}@keyframes orbBeat{0%{transform:scale(1)}14%{transform:scale(1.13)}28%{transform:scale(1)}42%{transform:scale(1.07)}70%,100%{transform:scale(1)}}#app .orb.dead{animation:none !important;opacity:.35;filter:grayscale(.6);transition:opacity .6s,filter .6s}#board{transition:background .8s,border-color .8s,box-shadow .4s,scale 1.1s cubic-bezier(.3,0,.2,1)}#board.zoom{scale:1.06}#moon{transition:top 1.1s cubic-bezier(.2,.8,.2,1),right 1.1s cubic-bezier(.2,.8,.2,1),width 1.1s cubic-bezier(.2,.8,.2,1),height 1.1s cubic-bezier(.2,.8,.2,1),box-shadow 1.1s,opacity .6s,scale .9s ease-out;scale:calc(1 + var(--heat,0) * .07)}/* ожидание бонуса: остальное поле в тени, тории бьются */#app .cell.adim{filter:brightness(.68) saturate(.6);transition:filter .35s}#app .cell.tbeat > *{animation:tbeat .62s ease-in-out infinite}@keyframes tbeat{0%,100%{transform:scale(1)}14%{transform:scale(1.14)}28%{transform:scale(1)}42%{transform:scale(1.07)}}/* цель выигрыша: тонкая полоса прогресса внизу табло и метка следующего порога */.wgoal{position:absolute;left:0;right:0;bottom:0;height:3px;pointer-events:none;opacity:0;transition:opacity .4s}.wgoal.on{opacity:1}.wgoal i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--blood);transition:width .35s ease-out}.wgoal span{position:absolute;right:10px;bottom:auto;top:-49px;font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:12px;letter-spacing:.06em;color:var(--blood);opacity:.85}.wgoal.hit span{animation:goalHit .7s ease-out}@keyframes goalHit{0%{transform:scale(1.8);opacity:1}100%{transform:scale(1)}}.winbar.near{animation:near .14s linear infinite}@keyframes near{0%{translate:0 0}25%{translate:.8px -.5px}50%{translate:-.8px .4px}75%{translate:.5px .5px}100%{translate:0 0}}/* облегчённый режим для слабых телефонов: без размытий и наездов, меньше теней */body.lite .pool,body.lite .bsplat,body.lite .bspray,body.lite .blot,body.lite .bridge,body.lite .stain{filter:none !important}body.lite #app .cell.soak.soak{animation-name:meltLite !important}@keyframes meltLite{0%{opacity:1}100%{opacity:0}}body.lite #board.zoom{scale:1}body.lite .vign{display:none}body.lite #app .orb.wait{filter:none}body.lite .winbar.near{animation:none
