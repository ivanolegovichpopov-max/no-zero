:var(--muted);margin-right:9px;letter-spacing:.04em;text-transform:none}.winbar #winLbl .wc.mul .v{color:var(--blood)}.winbar .lblghost{position:absolute;pointer-events:none;height:17px;overflow:hidden;display:flex;align-items:center;flex-wrap:nowrap;font-size:10px}.winbar #winLbl .wc .mi{display:inline-flex;width:9px;height:9px}.winbar #winLbl .wc .mi svg{width:9px;height:9px}.winfly{position:fixed;z-index:40;pointer-events:none;font-family:'Shippori Mincho B1',serif;font-weight:800;line-height:1.1;color:var(--ink);transform-origin:left center}.winbar #winLbl .wc .pic,.winbar #winLbl .wc svg{width:11px !important;height:11px !important;flex:0 0 11px}.winbar b{display:block;font-family:'Shippori Mincho B1',serif;font-size:30px;font-weight:800;line-height:1.1}#win{display:inline-block}#win.bump{animation:wb .35s ease-out}/* цель — красная нить по верхней линии стола */.wgoal{position:absolute;left:0;right:0;top:-1px;height:1.5px;pointer-events:none;opacity:0;transition:opacity .4s}.wgoal.on{opacity:1}.wgoal i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--blood);transition:width .35s ease-out}.wgoal span{position:absolute;right:2px;top:9px;font-family:'Manrope',sans-serif;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--blood);opacity:.85;white-space:nowrap;transform-origin:right center}.wgoal.hit span{animation:goalHit .7s ease-out}.winbar:has(#chip.on) .wgoal span,.winbar:has(#shareBtn.on) .wgoal span{display:none}.chip{display:none;align-items:center;justify-content:center;border:none;background:none}.chip.on{display:flex}.winbar #chip{padding:0 0 0 12px;border-left:1px solid var(--line);color:var(--blood);font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:22px}.winbar #shareBtn{width:40px;height:40px;padding:0;margin-left:6px;color:var(--ink)}.winbar #shareBtn svg{stroke:currentColor}.winbar .mulx{font-style:normal;font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:22px;color:#FF4650;margin-left:10px;display:inline-block;vertical-align:.25em;animation:mulIn .35s cubic-bezier(.2,1.4,.4,1) both}.winbar .mulx.out{animation:mulOut .4s ease-in forwards}/* стол */.controls{position:relative;z-index:1;flex:1 1 auto;display:flex;flex-direction:column;justify-content:space-evenly;gap:10px;padding:6px var(--edge) 6px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}/* ставка — сумма и линейка; свайп влево-вправо меняет ставку */.bet{display:flex;flex-direction:column;gap:2px;flex:1;max-width:230px;touch-action:pan-y;user-select:none;-webkit-user-select:none}.bet .lbl{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}.bet .r{display:flex;align-items:center;justify-content:space-between}.bet #bet{font-family:'Shippori Mincho B1',serif;font-size:27px;font-weight:800;min-width:100px;text-align:center;cursor:pointer;transition:transform .15s}.round{width:38px;height:38px;border:none;background:none;color:var(--muted);font-size:22px;font-weight:400;padding:0}.bet .round,.bet #bet{touch-action:pan-y}.round:active{color:var(--blood);transform:scale(.9)}.ruler{position:relative;height:13px;margin:1px 6px 0;border-top:1px solid var(--line)}.ruler .rt{display:flex;justify-content:space-between;align-items:flex-start;height:100%}.ruler .rt i{width:1px;height:4px;background:var(--line);transition:height .25s,background .25s}.ruler .rt i.big{height:7px}.ruler .rt i.near{height:6px;background:var(--muted)}.ruler .rmark{position:absolute;left:-.5px;top:0;width:2px;height:11px;border-radius:0 0 1px 1px;background:var(--blood);will-change:transform;transition:transform .32s cubic-bezier(.3,1.5,.5,1)}.ruler.drag .rmark{transition:none}.rscale{display:flex;justify-content:space-between;align-items:baseline;margin:2px 6px 0;font-size:9px;font-weight:600;letter-spacing:.04em;color:var(--muted);opacity:.75;white-space:nowrap}.rscale .mx{opacity:.9}.rscale .mx b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}.bet #bet,.ante small,.buy small{font-variant-numeric:tabular-nums}.roll{display:inline-block;position:relative;overflow:hidden;vertical-align:bottom}.roll>.ro{position:absolute;left:0;right:0;top:0;text-align:inherit}.round.lim{opacity:.25}/* спин — энсо: круг кистью; во время раунда круг дорисовывается и стирается */.spinWrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px}#spin{position:relative;width:96px;height:96px;border:none;border-radius:50%;padding:0;background:none;color:var(--blood);display:flex;align-items:center;justify-content:center;transition:transform .15s,opacity .45s ease,filter .45s ease;touch-action:manipulation;-webkit-touch-callout:none;user-select:none}#app.short #spin{width:84px;height:84px}#spin:active{transform:scale(.94)}#spin .enso{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}.enso path{fill:none;stroke-linecap:round}.enso .e1{stroke:var(--ink);stroke-width:6.5;stroke-dasharray:1 1;stroke-dashoffset:0}.enso .e2{stroke:var(--ink);stroke-width:2;opacity:.4;stroke-dasharray:.035 .014}.enso .eprog{stroke:var(--blood);stroke-width:2.6;stroke-dasharray:1 1;stroke-dashoffset:1;opacity:0;transition:stroke-dashoffset .3s,opacity .3s}#spin.auto .eprog{opacity:1}#spin.busy .enso .e1{animation:ensoDraw calc(1.2s*var(--t)) cubic-bezier(.55,0,.35,1) infinite}#spin.busy .enso .e2{opacity:.18}@keyframes ensoDraw{0%{stroke-dashoffset:1}55%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}#spin.pulse .enso .e1{animation:ensoPulse 1.8s ease-in-out infinite}@keyframes ensoPulse{0%,100%{stroke-width:6.5}50%{stroke-width:9}}#spin .spinIc{transition:transform .5s;position:relative}#spin .stopIc{display:none;width:20px;height:20px;background:var(--ink);border-radius:2px;position:relative}#spin .autoN{display:none;position:relative;font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:24px;color:var(--ink)}#spin.busy .spinIc{display:none}#spin.busy .stopIc{display:block}#spin.auto .spinIc,#spin.auto .stopIc{display:none}#spin.auto .autoN{display:block !important}/* турбо — молния у кольца */.tb{position:absolute;top:-8px;right:-18px;width:30px;height:30px;padding:6px;border:none;border-radius:50%;background:var(--paper);color:var(--muted);transition:color .25s,opacity .5s,visibility .5s}.tb svg{width:18px;height:18px}.tb.on{color:var(--blood)}.tb.on svg{fill:currentColor}.tb.hide{display:none}.spinWrap .cost{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);min-height:12px;transition:opacity .5s,visibility .5s}/* подпись под спином не должна менять ширину колонки — иначе спин и блок ставки сдвигаются */.spinWrap .cost{width:96px;display:flex;justify-content:center;white-space:nowrap;line-height:12px}/* автоигра — долгое нажатие на спин раскрывает веер вариантов */.radial{position:absolute;left:50%;top:48px;width:0;height:0;z-index:5;pointer-events:none}.radial button{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:16px;padding:0;opacity:0;transform:scale(.3);transition:transform .3s cubic-bezier(.2,1.35,.4,1),opacity .2s;pointer-events:none;box-shadow:0 4px 14px rgba(20,0,0,.12)}.radial button{display:grid;place-items:center}.radial button svg{width:18px;height:18px;display:block}.radial.on button{opacity:1;pointer-events:auto}.radial button:active{background:var(--blood);color:#fff;border-color:var(--blood)}#spin.hold .enso .e1{stroke:var(--blood);transition:stroke .4s}/* путь к бонусу: печать «Шанс+» и надпись «Бонус» с ценой; меню — «⋯» */.btns{display:flex;align-items:stretch;border-top:1px solid var(--line);min-height:48px}.btns button{border:none;background:none;color:var(--ink)}.btns .ante{display:flex;align-items:center;gap:10px;flex:1;padding:6px 2px;font-size:11px;font-weight:800;l * проверка честности — щит в нижней строке: до спина контур, после раунда щит наливается и появляется галочка */.btns .ic.fair .ck{opacity:0;stroke-dasharray:12;stroke-dashoffset:12;transition:opacity .2s}.btns .ic.fair.ok{color:var(--blood)}.btns .ic.fair.ok .sh{fill:rgba(179,18,27,.1)}.btns .ic.fair.ok .ck{opacity:1;animation:ckDraw .45s .1s ease-out forwards}.btns .ic.fair.ok.pop svg{animation:sealPop .5s cubic-bezier(.2,1.6,.4,1)}@keyframes ckDraw{to{stroke-dashoffset:0}}@keyframes sealPop{0%{transform:scale(1.4)}100%{transform:scale(1)}}.sealcard{display:flex;gap:14px;align-items:flex-start;margin:4px 0 14px}.sealcard .big{flex:0 0 54px;height:54px;display:grid;place-items:center;color:var(--muted)}.sealcard .big svg{width:46px;height:46px}.sealcard .big .ck{opacity:0}.sealcard .big.ok{color:var(--blood)}.sealcard .big.ok .ck{opacity:1}/* поле выигрыша: «×N ставки», лента последних раундов, итог сессии между раундами, разбор хода по касанию */.winbar .wmain{cursor:pointer}.winbar .winx{font-style:normal;font-family:'Manrope',sans-serif;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted);margin-left:8px;vertical-align:.45em;opacity:0;transition:opacity .3s}.winbar .winx.on{opacity:1}.winbar.idle #win{color:var(--muted)}.winbar.idle #win.plus{color:var(--ink)}.hstrip{flex:0 0 auto;align-self:stretch;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;padding:0 0 5px;margin:0;border:none;background:none;cursor:pointer;color:var(--muted)}.hstrip .hcap{font-family:'Manrope',sans-serif;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;line-height:17px;height:17px;color:var(--muted);white-space:nowrap}.hstrip .hcap::after{content:" ›";letter-spacing:0;font-weight:800}.hstrip .hrow{display:flex;align-items:flex-end;gap:8px}.hstrip .hbars{display:flex;align-items:flex-end;gap:4px;height:26px;padding:0 1px;border-bottom:1px solid var(--line)}.hstrip .hbars i{display:block;width:3px;border-radius:2px 2px 0 0;background:var(--line);transition:height .4s cubic-bezier(.2,1.3,.4,1)}.hstrip .hbars i.w{background:rgba(179,18,27,.5)}.hstrip .hbars i.b{background:var(--blood)}.hstrip .hbars i.new{animation:hsIn .45s cubic-bezier(.2,1.3,.4,1);transform-origin:bottom}.hstrip .hlast{font-style:normal;font-family:'Manrope',sans-serif;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted);line-height:1;padding-bottom:1px;min-width:22px;text-align:right}.hstrip .hlast.w{color:var(--blood)}.hstrip:active{opacity:.6}.winbar:has(.wgoal.on) .hcap{visibility:hidden}.hgraph{display:flex;align-items:flex-end;gap:7px;height:70px;border-bottom:1px solid var(--line);margin:6px 0 4px;padding:0 2px}.hgraph i{flex:1;max-width:14px;border-radius:3px 3px 0 0;background:var(--line)}.hgraph i.w{background:rgba(179,18,27,.5)}.hgraph i.b{background:var(--blood)}@keyframes hsIn{from{transform:scaleY(0);transform-origin:bottom}}.winbar:has(#chip.on) .hstrip,.winbar:has(#shareBtn.on) .hstrip,body.fs .hstrip{display:none}.bd{width:100%;border-collapse:collapse;font-size:13px}.bd td{padding:7px 0;border-bottom:1px solid var(--line)}.bd td:last-child{text-align:right;font-weight:800}.bd tr.h td{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding-top:14px}.bd tr.t td{border-bottom:none;font-family:'Shippori Mincho B1',serif;font-size:22px;padding-top:12px}.bd .ic11{display:inline-flex;vertical-align:-1px;margin-right:6px}.bd .ic11 svg{width:12px;height:12px}</style>
