eight:800;line-height:1;border-radius:4px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.28),0 2px 8px rgba(179,18,27,.35);transform:rotate(-4deg)}#app .cell.wild{background:var(--plate)}#app .cell.wildhit .seal{animation:sealHit .45s cubic-bezier(.2,1.6,.4,1);box-shadow:inset 0 0 0 2px rgba(255,255,255,.5),0 0 18px rgba(179,18,27,.85)}#app .cell.wildhit{box-shadow:0 0 0 2px var(--blood)}@keyframes sealHit{0%{transform:rotate(-4deg) scale(1.35)}100%{transform:rotate(-4deg) scale(1)}}#app .cell.stuck .seal{animation:sealStay .6s ease-out}@keyframes sealStay{0%{box-shadow:0 0 0 0 rgba(179,18,27,.9)}100%{box-shadow:0 0 0 14px rgba(179,18,27,0)}}/* «Затмение» — сцена */.eclipse{position:absolute;inset:-14px;z-index:6;pointer-events:none;overflow:visible}.eclipse .ecl-clip{position:absolute;inset:0;overflow:hidden}.eclipse .ecl-dark{position:absolute;inset:0;background:rgba(10,6,6,.0);transition:background .6s}.eclipse.s1 .ecl-dark{background:rgba(10,6,6,.42)}.eclipse .ecl-moon{position:absolute;width:115%;aspect-ratio:1;border-radius:50%;right:-120%;top:-60%;background:radial-gradient(circle at 45% 45%,rgba(20,6,8,.88) 0,rgba(20,6,8,.82) 58%,rgba(179,18,27,.55) 66%,rgba(179,18,27,0) 72%);transition:right 1s cubic-bezier(.3,0,.2,1),top 1s cubic-bezier(.3,0,.2,1)}.eclipse.s2 .ecl-moon{right:30%;top:-48%}.eclipse .ecl-txt{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%) scale(.92);text-align:center;color:#fff;font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:30px;letter-spacing:.28em;padding:14px 0;opacity:0;background:linear-gradient(90deg,transparent,rgba(10,6,6,.82) 18%,rgba(10,6,6,.82) 82%,transparent);text-shadow:0 0 18px rgba(179,18,27,.9);transition:opacity .4s,transform .4s,top .5s}.eclipse.s1 .ecl-txt{opacity:1;transform:translateY(-50%) scale(1)}.eclipse.s3 .ecl-txt{top:calc(100% + 28px);z-index:9;font-size:22px;padding:8px 0;background:rgba(10,6,6,.92)}#board.eclipsing{z-index:30 !important}.eclipse .ecl-txt small{display:block;fo
