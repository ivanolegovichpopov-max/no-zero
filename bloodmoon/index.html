nter;justify-content:space-between;gap:12px;min-height:50px;padding:8px 14px;margin:0 0 8px;background:color-mix(in srgb,var(--blood) 8%,transparent);color:var(--si);font-size:14px;font-weight:600;line-height:1.35;animation:cpIn .45s cubic-bezier(.2,.8,.2,1)}#sheet .cpend button,#sheet .crow button{border:none;background:none;padding:6px 0;color:var(--blood);font:inherit;font-weight:800;white-space:nowrap}#sheet .crow button{padding:0;font-size:12px}@keyframes cpIn{from{opacity:0;transform:translateY(-6px)}}#sheet .crow{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:8px;min-height:52px;border-bottom:1px solid var(--sl)}#sheet .crow .t{color:var(--sm);font-size:12px;line-height:1.3;font-variant-numeric:tabular-nums}#sheet .crow .ck{display:flex;flex-direction:column;line-height:1.3}#sheet .crow .ck b{font-size:14px;font-weight:700;color:var(--si)}#sheet .crow .ck i{font-style:normal;font-size:12px;color:var(--sm)}#sheet .crow.pending .ck i{color:var(--blood)}#sheet .crow .ca{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:16px;color:var(--si);font-variant-numeric:tabular-nums;text-align:right}#sheet .crow.rejected .ca,#sheet .crow.cancelled .ca{color:var(--sm);text-decoration:line-through;text-decoration-thickness:1px}#sheet .cempty{text-align:center;color:var(--sm);font-size:14px;padding-top:70px}#sheet .ctest{text-align:center;font-size:11px;color:var(--sm);margin:10px 0 0;visibility:hidden}</style>
