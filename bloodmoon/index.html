:1fr 40% 1fr;align-items:center !important;column-gap:10px}body.fs .sub #subL{justify-self:start;line-height:1}body.fs .sub .fsprog{position:relative;width:100%;transform:none;left:auto;top:auto;align-self:center;grid-column:2;grid-row:1}/* тории и ромбики каскада встают на место шкалы, по центру; шкала на это время прячется */body.fs.tmOn .sub .fsprog,body.fs.cmOn .sub .fsprog{visibility:hidden}body.fs.tmOn .sub .meters,body.fs.cmOn .sub .meters{grid-column:2;grid-row:1;justify-self:center;gap:7px !important;max-width:none !important;overflow:visible !important;flex:none !important}body.fs .sub .tmeter{gap:4px !important}body.fs .sub .tmeter i{width:15px !important;height:13px !important}body.fs .sub .cmeter{gap:4px !important}body.fs .sub .cmeter i{width:9px !important;height:9px !important}body.fs.tmOn.cmOn .sub .meters::before{height:11px}body.fs.tmOn .sub .tmeter,body.fs.cmOn .sub .cmeter{animation:mtrIn .35s ease-out}@keyframes mtrIn{from{opacity:0;transform:scale(.85)}}/* на красной луне шкала должна читаться: светлая основа, белая заливка */body.fs .fsprog::before{background:rgba(255,255,255,.5)}body.fs .fsprog .fl{background:#fff;box-shadow:none}body.fs .fsprog .tk{background-image:linear-gradient(90deg,rgba(255,255,255,.6) 0,rgba(255,255,255,.6) 1px,transparent 1px);border-right-color:rgba(255,255,255,.6)}body.fs .sub .meters i,body.fs .sub .meters svg{flex-shrink:1}/* бонус: итог внизу справа, напротив выигрыша фриспина; вверху — только спины и счётчики */.fstot{display:none}body.fs .fstot{display:flex;flex-direction:column;align-items:flex-end;gap:0}body.fs .fstot .lbl{color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;line-height:1.3}body.fs .fstot b{font-family:'Shippori Mincho B1',serif;font-size:30px;font-weight:800;line-height:1.1;color:#FF4650;font-variant-numeric:tabular-nums}body.fs .fstot.up b{animation:omHit .6s ease-out}body.fs .sub #subR{display:none !important}body.fs .wgoal span{right:auto;left:5 opts{gap:4px 2px}@media (max-width:380px){#sheet .cform .opts button{font-size:14px}}#sheet .cform .opts button:disabled{color:var(--sl) !important}#sheet .cform .wide{margin-top:0}#sheet .chint{text-align:left;font-size:12px;color:var(--sm);margin:10px 0 0}#sheet .cpend{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:8px 14px;margin:0 0 8px;background:color-mix(in srgb,var(--blood) 8%,transparent);color:var(--si);font-size:14px;font-weight:600;line-height:1.35;animation:cpIn .45s cubic-bezier(.2,.8,.2,1)}#sheet .cpend button,#sheet .crow button{border:none;background:none;padding:6px 0;color:var(--blood);font:inherit;font-weight:800;white-space:nowrap}#sheet .crow button{padding:0;font-size:12px}@keyframes cpIn{from{opacity:0;transform:translateY(-6px)}}#sheet .crow{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:8px;min-height:52px;border-bottom:1px solid var(--sl)}#sheet .crow .t{color:var(--sm);font-size:12px;line-height:1.3;font-variant-numeric:tabular-nums}#sheet .crow .ck{display:flex;flex-direction:column;line-height:1.3}#sheet .crow .ck b{font-size:14px;font-weight:700;color:var(--si)}#sheet .crow .ck i{font-style:normal;font-size:12px;color:var(--sm)}#sheet .crow.pending .ck i{color:var(--blood)}#sheet .crow .ca{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:16px;color:var(--si);font-variant-numeric:tabular-nums;text-align:right}#sheet .crow.rejected .ca,#sheet .crow.cancelled .ca{color:var(--sm);text-decoration:line-through;text-decoration-thickness:1px}#sheet .cempty{color:var(--sm);font-size:14px;padding-top:14px}#sheet .ctest{text-align:left;font-size:11px;color:var(--sm);margin:10px 0 0;visibility:hidden}</style>
