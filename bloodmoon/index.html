eight:800;line-height:1;border-radius:4px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.28),0 2px 8px rgba(179,18,27,.35);transform:rotate(-4deg)}#app .cell.wild{background:var(--plate)}#app .cell.wildhit .seal{animation:sealHit .45s cubic-bezier(.2,1.6,.4,1);box-shadow:inset 0 0 0 2px rgba(255,255,255,.5),0 0 18px rgba(179,18,27,.85)}#app .cell.wildhit{box-shadow:0 0 0 2px var(--blood)}@keyframes sealHit{0%{transform:rotate(-4deg) scale(1.35)}100%{transform:rotate(-4deg) scale(1)}}#app .cell.stuck .seal{animation:sealStay .6s ease-out}@keyframes sealStay{0%{box-shadow:0 0 0 0 rgba(179,18,27,.9)}100%{box-shadow:0 0 0 14px rgba(179,18,27,0)}}/* «Затмение» — сцена */.eclipse{position:absolute;inset:-14px;z-index:6;pointer-events:none;overflow:visible}.eclipse .ecl-clip{position:absolute;inset:0;overflow:hidden}.eclipse .ecl-dark{position:absolute;inset:0;background:rgba(10,6,6,.0);transition:background .6s}.eclipse.s1 .ecl-dark{background:rgba(10,6,6,.42)}.eclipse .ecl-moon{position:absolute;width:115%;aspect-ratio:1;border-radius:50%;right:-120%;top:-60%;background:radial-gradient(circle at 45% 45%,rgba(20,6,8,.88) 0,rgba(20,6,8,.82) 58%,rgba(179,18,27,.55) 66%,rgba(179,18,27,0) 72%);transition:right 1s cubic-bezier(.3,0,.2,1),top 1s cubic-bezier(.3,0,.2,1)}.eclipse.s2 .ecl-moon{right:30%;top:-48%}.eclipse .ecl-txt{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%) scale(.92);text-align:center;color:#fff;font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:30px;letter-spacing:.28em;padding:14px 0;opacity:0;background:linear-gradient(90deg,transparent,rgba(10,6,6,.82) 18%,rgba(10,6,6,.82) 82%,transparent);text-shadow:0 0 18px rgba(179,18,27,.9);transition:opacity .4s,transform .4s,top .5s}.eclipse.s1 .ecl-txt{opacity:1;transform:translateY(-50%) scale(1)}.eclipse.s3 .ecl-txt{top:calc(100% + 28px);z-index:9;font-size:22px;padding:8px 0;background:rgba(10,6,6,.92)}#board.eclipsing{z-index:30 !important}.eclipse .ecl-txt small{display:block;font-family:'Manrope',sans-serif;font-size:14px;font-weight:800;letter-spacing:.12em;margin-top:6px;opacity:0;transition:opacity .4s}.eclipse.s3 .ecl-txt small{opacity:1}.eclipse.out{opacity:0;transition:opacity .6s}#board.eclipsing #reels{filter:none}#app .cell.ecl-target{z-index:7;box-shadow:0 0 0 2px #FF4650,0 0 16px rgba(255,70,80,.7);animation:eclPulse .5s ease-in-out infinite alternate}@keyframes eclPulse{from{box-shadow:0 0 0 2px #FF4650,0 0 8px rgba(255,70,80,.5)}to{box-shadow:0 0 0 3px #FF4650,0 0 22px rgba(255,70,80,.9)}}#app .cell.ecl-new{z-index:7;box-shadow:0 0 0 2px #FF4650}.ecl-sweep{position:absolute;z-index:8;pointer-events:none;background:linear-gradient(90deg,#141414 0,#141414 70%,rgba(20,20,20,0));transform-origin:left center;animation:inkSweep .26s cubic-bezier(.5,0,.5,1) forwards}@keyframes inkSweep{0%{transform:scaleX(0);opacity:1}55%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1) translateX(30%);opacity:0}}#app .cell.morph{animation:morph .5s ease-out}@keyframes morph{0%{filter:brightness(2.2) blur(2px)}100%{filter:none}}/* ===== гипнотическое поле ===== *//* покой: символы чуть дышат волной по колонкам */#app .cell.hi:not(.win):not(.dim) .g{animation:breathe 4.8s ease-in-out infinite}#app .cell.lo:not(.win):not(.dim) .g{animation:breathe 6.4s ease-in-out infinite}@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}#board.moving .cell .g{animation:none !important}/* выигрыш старших символов: у каждого свой жест */#app .cell.win[data-s="0"] .g{animation:oni .7s ease-out}@keyframes oni{0%{transform:scale(1.25)}20%{transform:scale(1.15) rotate(-6deg)}40%{transform:scale(1.15) rotate(6deg)}60%{transform:scale(1.1) rotate(-3deg)}100%{transform:scale(1)}}#app .cell.win[data-s="1"] .g{animation:katana .6s cubic-bezier(.2,1.4,.4,1)}@keyframes katana{0%{transform:rotate(-35deg) scale(.9)}60%{transform:rotate(8deg) scale(1.15)}100%{transform:none}}#app .cell.win[data-s="2"] .g{animation:crane .8s ease-in-out}@keyframes crane{0%,100%{transform:none}25%{transform:scaleY(.75) translateY(4%)}50%{transform:scaleY(1.12) translateY(-6%)}75%{transform:scaleY(.85)}}#app .cell.win[data-s="3"] .g{animation:fan .6s cubic-bezier(.2,1.5,.4,1)}@keyframes fan{0%{transform:scaleX(.25)}100%{transform:none}}/* мелкий выигрыш (меньше ставки) — без вспышки */#board.soft .cell.win{animation:none !important;box-shadow:none !important}/* нарастание каскада: края экрана затягивает кровавой тушью */.vign{position:absolute;inset:0;pointer-events:none;z-index:0;opacity:calc(var(--heat,0) * .9);transition:opacity .6s ease-out;background:radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(120,8,14,.22) 72%,rgba(60,4,8,.55) 100%)}#moon{filter:brightness(calc(1 + var(--heat,0) * .25)) saturate(calc(1 + var(--heat,0) * .3))}/* посадка луны-множителя: круги по воде */#app .cell.ripple::after{content:"";position:absolute;inset:10%;border-radius:50%;border:2px solid var(--blood);animation:ripple 1.1s ease-out forwards;pointer-events:none}#app .cell.ripple::before{content:"";position:absolute;inset:10%;border-radius:50%;border:1.5px solid var(--blood);animation:ripple 1.1s .18s ease-out forwards;pointer-events:none;opacity:0}@keyframes ripple{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}/* крупный выигрыш: экран заливает кровавой тушью из-за краёв */.ov.bw{background:rgba(10,6,6,.86)}.ov.bw::before{content:"";position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 30%,rgba(179,18,27,.55) 60%,rgba(90,6,10,.9) 85%);animation:inkFlood 1.4s cubic-bezier(.2,.7,.3,1) forwards}@keyframes inkFlood{0%{transform:scale(1.6);opacity:0}100%{transform:scale(1);opacity:1}}/* «Затмение»: надпись на полосе тени */.eclipse .ecl-txt{font-size:24px !important;letter-spacing:.24em !important;padding:12px 0;background:linear-gradient(90deg,transparent,rgba(10,6,6,.72) 20%,rgba(10,6,6,.72) 80%,transparent)}.eclipse .ecl-txt small{font-size:20px !important}</style>
