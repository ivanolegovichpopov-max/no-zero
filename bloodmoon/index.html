:22px}.winbar #shareBtn{width:40px;height:40px;padding:0;margin-left:6px;color:var(--ink)}.winbar #shareBtn svg{stroke:currentColor}.winbar .mulx{font-style:normal;font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:22px;color:#FF4650;margin-left:10px;display:inline-block;vertical-align:.25em;animation:mulIn .35s cubic-bezier(.2,1.4,.4,1) both}.winbar .mulx.out{animation:mulOut .4s ease-in forwards}/* стол */.controls{position:relative;z-index:1;flex:1 1 auto;display:flex;flex-direction:column;justify-content:space-evenly;gap:10px;padding:6px var(--edge) 6px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}/* ставка — сумма и линейка; свайп влево-вправо меняет ставку */.bet{display:flex;flex-direction:column;gap:2px;flex:1;max-width:230px;touch-action:pan-y;user-select:none;-webkit-user-select:none}.bet .lbl{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}/* при «Шансе» справа в строке ставки — сколько реально спишется за спин */.bet .blrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-height:12px}.bet .debit{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--blood);white-space:nowrap;opacity:0;transition:opacity .3s}.bet .debit.on{opacity:1}.bet .r{display:flex;align-items:center;justify-content:space-between}.bet #bet{font-family:'Shippori Mincho B1',serif;font-size:27px;font-weight:800;min-width:100px;text-align:center;cursor:pointer;transition:transform .15s}.round{width:38px;height:38px;border:none;background:none;color:var(--muted);font-size:22px;font-weight:400;padding:0}.bet .round,.bet #bet{touch-action:pan-y}.round:active{color:var(--blood);transform:scale(.9)}.ruler{position:relative;height:13px;margin:1px 6px 0;border-top:1px solid var(--line)}.ruler .rt{display:flex;justify-content:space-between;align-items:flex-start;height:100%}.ruler .rt i{width:1px;height:4px;background:var(--line);transition:height .25s,background .25s}.
