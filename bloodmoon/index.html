k='url(%23m)' fill='%23B3121B'%3E %3Cpath d='M12 26 C 18 10 46 8 80 10 C 150 12 214 14 256 18 C 276 21 288 30 289 42 C 289 54 278 63 258 68 C 210 77 144 82 78 82 C 44 82 18 78 10 64 C 4 52 6 38 12 26 Z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E") center/106% 116% no-repeat !important}/* строка над полем: по центру, линии и ромбы */.legend{justify-content:center !important;padding:0 16px !important;margin:12px 0 10px !important;gap:10px;color:var(--ink);font-size:10.5px;letter-spacing:.3em}.legend::before,.legend::after{display:block !important;content:"";flex:1;height:1px;background:var(--line)}.legend .c{display:flex;align-items:center;gap:10px;background:var(--paper);padding:3px 10px;transition:background .8s}.legend .c span{margin-right:-.3em}.legend .c i{width:5px;height:5px;background:var(--blood);transform:rotate(45deg);flex:0 0 5px}.legend .c i.o{background:none;border:1px solid var(--blood);width:6px;height:6px;flex-basis:6px}/* меньше пустоты сверху: поле поднимается, свободное место — ровно в нижней части */body:not(.fs) #boardWrap{margin-top:0 !important}.controls{margin-top:0 !important;flex:1 1 auto;justify-content:space-evenly !important;gap:12px}#moon{width:360px;height:360px;top:calc(var(--sat) - 6px);right:-195px}.btns .buy{padding:0 26px 0 6px !important}</style>
