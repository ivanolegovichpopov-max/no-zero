bic-bezier(.3,1.25,.5,1) !important}#app .cell.half.win{box-shadow:none}/* строка над полем постоянной высоты: смена текста на значки тории/множителя не сдвигает поле */body:not(.fs) .legend{height:26px;min-height:26px;max-height:26px;box-sizing:border-box;overflow:visible}/* третий тории: тории вспыхивают по цепочке; почти попадание: красный медленно гаснет */#app .cell.trig{background:var(--plate) !important}#app .cell.trig .tor{filter:drop-shadow(0 0 8px rgba(179,18,27,.55))}#app .cell.tmiss .tor{animation:tmiss 1.4s ease-out both}@keyframes tmiss{0%{filter:drop-shadow(0 0 8px rgba(179,18,27,.5));opacity:1}45%{opacity:.45;filter:none}100%{opacity:1;filter:none}}/* брызги у вайлдов гаснут, как только начинается подсветка выигрыша */#fx .bsplat.spr{transition:opacity .35s ease}body.winning #fx .bsplat.spr{opacity:0 !important}/* стекло с кровью поверх всей игры, не перехватывает касания */#glass,#glassOld{position:fixed;inset:0;z-index:19;pointer-events:none;overflow:hidden}#glass .gdrop,#glassOld .gdrop,#glass .grun,#glassOld .grun{position:absolute;filter:drop-shadow(0 1px 1px rgba(40,0,0,.25))}#glass .old{opacity:.5;transition:opacity 1.1s ease}#glass .old svg{filter:brightness(.58) saturate(.6) sepia(.25);transition:filter 1.1s ease}#glass .old .gh{opacity:0}/* ожидание тории: живые колонки — размытый крутящийся барабан */.antcol{overflow:hidden}.antcol .astrip{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;align-items:center;filter:blur(1.6px);opacity:.55}.antcol .astrip i{display:flex;align-items:center;justify-content:center;height:var(--ch);flex:0 0 var(--ch);color:var(--ink);transform:scaleY(1.35)}body.fs .antcol .astrip i{color:#F6F3EE}/* луна и края экрана дышат в такт; луна краснеет с каждой колонкой */body.abeat #moon{animation:moonbeat var(--beat,.62s) ease-in-out infinite;filter:saturate(calc(.8 + var(--mk,1) * .25)) brightness(calc(.95 + var(--mk,1) * .05))}@keyframes moonbeat{0%,100%{box-shadow:0 0 calc(30px * var(--mk,1)
