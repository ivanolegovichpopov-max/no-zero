<style>:root{--paper:#F6F3EE;--ink:#141414;--blood:#B3121B;--muted:#5A5650;--cell-bg:#FFFFFF;--board-bg:#FFFFFF;--board-line:#141414;--lo:#141414;--hi:#B3121B;--t:1;--sat:max(env(safe-area-inset-top,0px),calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)));--sab:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px))}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;overscroll-behavior:none}body{transition:background .8s,color .8s}body.fs{--paper:#0F0D0D;--ink:#F6F3EE;--muted:#C9C4BC;--cell-bg:#161212;--board-bg:#1C1818;--board-line:#3A3232;--lo:#F6F3EE;--hi:#FF6B73}button{font-family:inherit;cursor:pointer;color:inherit}#app{position:relative;height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;padding:calc(var(--sat) + 6px) 0 calc(var(--sab) + 8px)}#moon{position:absolute;border-radius:50%;background:radial-gradient(circle at 38% 36%,#D41E28 0,#B3121B 45%,#8E0E16 100%);pointer-events:none;transition:top 1s cubic-bezier(.2,.8,.2,1),right 1s cubic-bezier(.2,.8,.2,1),box-shadow 1s;top:calc(var(--sat) - 200px);right:-150px;width:320px;height:320px;animation:moonbreath 5s ease-in-out infinite}@keyframes moonbreath{50%{transform:scale(1.025)}}body.fs #moon{top:calc(var(--sat) - 60px);right:calc(50% - 160px);box-shadow:0 0 120px 20px rgba(179,18,27,.45)}.top,.title,#fshead,.sub,#boardWrap,#dots,.winbar{flex-shrink:0;position:relative}.top{display:flex;justify-content:space-between;align-items:center;padding:6px 16px 0;gap:8px}.top .l{display:flex;gap:8px}.icon-btn{width:44px;height:44px;border:1px solid var(--ink);background:var(--paper);border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;transition:background .8s,border-color .8s}.bal{display:flex;flex-direction:colum %;background:radial-gradient(circle at 38% 36%,#D41E28 0,#B3121B 45%,#8E0E16 100%);display:flex;align-items:center;justify-content:center;animation:breathe 1.6s ease-in-out infinite}#gate .m span{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:44px;color:#fff}@keyframes breathe{50%{transform:scale(1.06);box-shadow:0 0 40px rgba(179,18,27,.45)}}#gate .bar{width:140px;height:2px;background:#E2DCD3;overflow:hidden}#gate .bar i{display:block;height:100%;width:40%;background:#141414;animation:load 1.1s ease-in-out infinite}@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(250%)}}#gate.hide{opacity:0;pointer-events:none}#gate.static .bar{display:none}.float{position:absolute;font-weight:800;color:#fff;font-size:22px;pointer-events:none;animation:up 1s ease-out forwards;z-index:5}@keyframes up{to{transform:translateY(-40px);opacity:0}}#onb{position:fixed;inset:0;z-index:45;background:#F6F3EE;display:none;flex-direction:column;padding:calc(var(--sat) + 24px) 20px calc(20px + var(--sab));max-width:460px;margin:0 auto}#onb.on{display:flex}#onb .pic{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}#onb h2{font-size:26px;margin:0 0 8px;font-weight:800}#onb p{margin:0 0 18px;font-size:15px;line-height:1.5;color:#3A3632}#onb .nav{display:flex;justify-content:space-between;align-items:center;gap:12px}#onb .dots{display:flex;gap:6px}#onb .dots i{width:8px;height:8px;border-radius:50%;background:#D8D1C6}#onb .dots i.on{background:#B3121B}#onb .skip{background:none;border:none;font-weight:600;color:#5A5650;font-size:14px;min-height:44px}#onb .nx{min-width:140px;height:50px;border:none;background:#141414;color:#fff;font-weight:800;font-size:15px}.mini{display:grid;grid-template-columns:repeat(6,40px);gap:3px;padding:6px;background:#fff;border:1px solid #141414}.mini div{height:40px;display:flex;align-items:center;justify-content:center;font-family:'Shippori Mincho B1',serif;font-size:22px;background:#fff;color:#141414;o <body>
<div id="gate"><div class="m"><span>血月</span></div><div class="bar"><i></i></div><div id="gateMsg" style="font-weight:600;max-width:300px"></div></div>

<div id="app">
  <div id="moon" aria-hidden="true"></div>
  <div id="replayTag"></div>
  <div class="top">
    <div class="l">
      <button class="icon-btn" id="menuBtn" aria-label="Menu">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 5h14M2 9h14M2 13h14"/></svg>
      </button>
      <button class="icon-btn" id="sndBtn" aria-label="Sound">
        <svg id="sndOn" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h3l4-3v10l-4-3H3z"/><path d="M13 7.5a3.5 3.5 0 0 1 0 5M15.5 5a7 7 0 0 1 0 10"/></svg>
        <svg id="sndOff" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M3 8h3l4-3v10l-4-3H3z"/><path d="M13 8l4 4M17 8l-4 4"/></svg>
      </button>
    </div>
    <div class="bal"><span class="lbl" data-t="balance"></span><b><span id="bal">—</span><small>₣</small></b></div>
  </div>
  <div class="title"><span class="k">血月</span><span class="n" data-t="title"></span></div>
  <div id="fshead"><span class="lbl" data-t="totalMult"></span><span class="k" id="fsMult">×0</span></div>
  <div class="sub"><span id="subL"></span><span id="subR"></span></div>
  <div id="boardWrap"><div id="board"><div id="reels"></div><div id="fx"></div></div></div>
  <div id="dots" aria-hidden="true"></div>
  <div class="winbar">
    <div><span class="lbl" id="winLbl"></span><b id="win">0,00</b></div>
    <div class="chip" id="chip">×0</div>
    <button class="chip" id="shareBtn" aria-label="Share">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2v10M5 6l4-4 4 4M3 11v4h12v-4"/></svg>
    </button>
  </div>
  <div class="controls">
    <div class="row">
      <div class="bet">
        <span class="lbl" id="betLbl"></span>
        <div class="r">
          <button class="round" id="betDn" aria-label="−">−</button>
          <b id="bet">—</b>
          <button class="round" id="betUp" aria-label="+">+</button>
        </div>
      </div>
      <button id="spin" aria-label="Spin">
        <svg class="spinIc" width="36" height="36" viewBox="0 0 38 38" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M31 19a12 12 0 1 1-4-9"/><path d="M28 4v7h-7"/></svg>
        <span class="stopIc" aria-hidden="true"></span>
      </button>
    </div>
    <div class="btns">
      <button id="autoBtn" data-t="auto"></button>
      <button id="turboBtn" data-t="turbo"></button>
      <button id="anteBtn" data-t="chance"></button>
      <button class="buy" id="buyBtn" data-t="bonus"></button>
    </div>
    <div class="foot"><span data-t="foot"></span><button id="rulesBtn" data-t="rules"></button></div>
  </div>
</div>

<div id="tip" role="tooltip"></div>
<div class="ov" id="ov"><div class="box" id="ovBox"></div></div>
<div id="onb" role="dialog" aria-modal="true">
  <div class="pic" id="onbPic"></div>
  <h2 id="onbT"></h2><p id="onbD"></p>
  <div class="nav"><button class="skip" id="onbSkip"></button><div class="dots" id="onbDots"></div><button class="nx" id="onbNext"></button></div>
</div>
<div class="shade" id="shade"></div>
<section class="sheet" id="sheet" aria-modal="true" role="dialog">
  <header><b id="sheetTitle"></b><button class="icon-btn" id="sheetClose" aria-label="Close" style="border-color:#141414;background:#F6F3EE;color:#141414">✕</button></header>
  <div class="body" id="sheetBody"></div>
