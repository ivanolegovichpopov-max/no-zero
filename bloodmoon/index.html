transform .3s;max-width:90%;text-align:center}#toast.on{transform:translate(-50%,0)}#gate{position:fixed;inset:0;background:#F6F3EE;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px;text-align:center;transition:opacity .5s}#gate .m{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 38% 36%,#D41E28 0,#B3121B 45%,#8E0E16 100%);display:flex;align-items:center;justify-content:center;animation:breathe 1.6s ease-in-out infinite}#gate .m span{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:44px;color:#fff}@keyframes breathe{50%{transform:scale(1.06);box-shadow:0 0 40px rgba(179,18,27,.45)}}#gate .bar{width:140px;height:2px;background:#E2DCD3;overflow:hidden}#gate .bar i{display:block;height:100%;width:40%;background:#141414;animation:load 1.1s ease-in-out infinite}@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(250%)}}#gate.hide{opacity:0;pointer-events:none}#gate.static .bar{display:none}.float{position:absolute;font-weight:800;color:#fff;font-size:22px;pointer-events:none;animation:up 1s ease-out forwards;z-index:5}.fly{position:fixed;left:0;top:0;z-index:18;font-weight:800;font-size:15px;color:#fff;background:var(--blood);padding:3px 8px;border-radius:12px;pointer-events:none;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.3)}.flyorb{position:fixed;left:0;top:0;z-index:18;pointer-events:none}.ov .cnt{font-family:'Manrope',sans-serif;font-weight:800;font-size:54px;line-height:1;color:#fff;margin-top:10px;font-variant-numeric:tabular-nums}.ov .tier{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:72px;line-height:1;color:#FF4650;transition:transform .25s}.ov .tier.bump{transform:scale(1.18)}.ov .hint{font-size:11px;letter-spacing:.2em;margin-top:22px;opacity:.6}#win{display:inline-block}#win.bump{animation:wb .35s ease-out}@keyframes wb{30%{transform:scale(1.12)}}#fshead .k.bump{transform:scale(1.3)}@keyframes up{to{transform:translateY(-40px);opacity:0}}#onb{position:fixed;inset:0;z-index:45;background:#F6F3EE;display:none;flex-direction:column;padding:calc(var(--sat) + 24px) 20px calc(20px + var(--sab));max-width:460px;margin:0 auto}#onb.on{display:flex}#onb .pic{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}#onb h2{font-size:26px;margin:0 0 8px;font-weight:800}#onb p{margin:0 0 18px;font-size:15px;line-height:1.5;color:#3A3632}#onb .nav{display:flex;justify-content:space-between;align-items:center;gap:12px}#onb .dots{display:flex;gap:6px}#onb .dots i{width:8px;height:8px;border-radius:50%;background:#D8D1C6}#onb .dots i.on{background:#B3121B}#onb .skip{background:none;border:none;font-weight:600;color:#5A5650;font-size:14px;min-height:44px}#onb .nx{min-width:140px;height:50px;border:none;background:#141414;color:#fff;font-weight:800;font-size:15px}.mini{display:grid;grid-template-columns:repeat(6,40px);gap:3px;padding:6px;background:#fff;border:1px solid #141414}.mini div{height:40px;display:flex;align-items:center;justify-content:center;font-family:'Shippori Mincho B1',serif;font-size:22px;background:#fff;color:#141414;opacity:.3}.mini div.w{background:#B3121B;color:#fff;opacity:1}.eq{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:800}.eq .o{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 36% 32%,#D8222C 0,#8E0E16 55%,#4A070C 100%);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:inset -4px -5px 10px rgba(0,0,0,.45)}/* ===== 血月 · единый стиль (поверх текущей версии) =====Правила: 1) всё — прямоугольник с тонкой линией туши; круг только у луны, спина и орбов2) красный — только событие и главное действие3) крупные цифры — минчо4) пустота заполняется средой (луна, туман, бумага, знак), а не элементами */:root{--line:rgba(20,20,20,.24)}body.dark,body.fs{--line:rgba(246,243,238,.22)}/* --- среда: бумага, туман, водяной знак --- */#app::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}.mist2{position:absolute;left:0;right:0;bottom:0;height:46%;pointer-events:none;z-index:0;background:linear-gradient(180deg,transparent,rgba(179,18,27,.06) 45%,rgba(179,18,27,.13))}body:not(.dark):not(.fs) .mist2{background:linear-gradient(180deg,transparent,rgba(179,18,27,.035) 50%,rgba(179,18,27,.07))}/* луна крупнее и ниже — заполняет верх, со свечением-ореолом */#moon{width:440px;height:440px;top:calc(var(--sat) - 225px);right:-175px;box-shadow:0 0 90px 10px rgba(179,18,27,.28)}#moon::after{content:"";position:absolute;inset:-26px;border-radius:50%;border:1px solid rgba(179,18,27,.35)}/* --- шапка --- */.top{padding:6px 16px 0}.top .l{background:transparent}.bal{border-radius:0 !important;background:var(--paper) !important;border:1px solid var(--line);padding:7px 12px !important}.bal b{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:20px;gap:9px}.bal .coin{display:none}.bal b::before{content:"枚";display:grid;place-items:center;width:20px;height:20px;background:var(--blood);color:#fff;font-size:12px;font-weight:800;border-radius:3px;box-shadow:0 0 10px rgba(179,18,27,.35);order:-1}/* линейка-заголовок над полем: заполняет пустоту информацией */.legend{position:relative;z-index:1;display:flex;align-items:center;gap:10px;padding:0 16px;margin:auto 0 10px;font-size:10px;font-weight:800;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;white-space:nowrap}.legend::before,.legend::after{content:"";flex:1;height:1px;background:var(--line)}.legend i{font-style:normal;color:var(--blood);font-family:'Shippori Mincho B1',serif;font-size:13px;letter-spacing:0}body:not(.fs) #boardWrap{margin-top:0 !important}/* --- поле: одна рама, засечки по углам --- */#board{border:1px solid var(--line);background:transparent;padding:7px}body.dark #board,body.fs #board{background:rgba(255,255,255,.015)}#board::before,#board::after{content:"";position:absolute;width:14px;height:14px;border:1.5px solid var(--blood);z-index:3;pointer-events:none}#board::before{left:-4px;top:-4px;border-right:0;border-bottom:0}#board::after{right:-4px;bottom:-4px;border-left:0;border-top:0}body.dark .cell{background:rgba(255,255,255,.035)}body:not(.dark):not(.fs) .cell{background:#fff}/* --- выигрыш: та же рама, цифры минчо --- */.winbar{position:relative;z-index:1;background:transparent !important;color:var(--ink) !important;border:1px solid var(--line);box-shadow:inset 3px 0 0 var(--blood) !important;min-height:58px}.winbar b{font-family:'Shippori Mincho B1',serif;font-size:26px;font-weight:800}.winbar .lbl{color:var(--muted) !important;opacity:1}.winbar .lbl .wc{border-radius:0;background:transparent !important;border:1px solid var(--line)}/* --- управление: квадраты вместо кругов и пилюль --- */.controls{z-index:1;gap:16px}.bet b{font-family:'Shippori Mincho B1',serif;font-size:22px}.round{border-radius:0;border:1px solid var(--line);background:transparent;width:44px;height:44px}.btns{gap:6px}.btns button{border:1px solid var(--line);background:transparent;border-radius:0 !important}.btns .ic{border-radius:0 !important}.btns .ante{border-radius:0 !important;letter-spacing:.14em}.btns .ante .sw{border-radius:2px}.btns .ante .sw::after{border-radius:1px}.btns .buy{background:var(--blood);border:none;color:#fff;letter-spacing:.2em;position:relative}.btns .buy::after{content:"";position:absolute;inset:3px;border:1px solid rgba(255,255,255,.35);pointer-events:none}.lbl{letter-spacing:.24em}/* спин: остаётся красным кругом, кольцо — мазок энсо */#spin{box-shadow:none}#spin::before{content:"";position:absolute;inset:-9px;pointer-events:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 3 A47 47 0 1 1 14 20' fill='none' stroke='%23B3121B' stroke-width='2.6' stroke-linecap='round' opacity='.85'/><path d='M14 20 A47 47 0 0 1 22 12' fill='none' stroke='%23B3121B' stroke-width='1.2' stroke-linecap='round' opacity='.5'/></svg>") center/100% no-repeat;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}#spin.busy::before{transform:rotate(200deg)}#spin.busy{background:var(--ink)}#spin.pulse{animation:none}.controls{margin-top:16px !important}#board{background:var(--paper) !important}body.dark .cell{background:#1A1615}body.dark #board,body.fs #board{background:#110F0E !important}/* во время прокрутки: тёмный круг, светлый стоп — без белого пятна */body.dark #spin.busy,body.fs #spin.busy{background:#1A1615;box-shadow:inset 0 0 0 1px var(--line)}body.dark #spin .stopIc,body.fs #spin .stopIc{background:#F6F3EE;border-radius:2px}</style>
