sform:rotate(45deg)}#toast.on{transition:transform .45s cubic-bezier(.2,.9,.25,1.15),opacity .25s,visibility 0s !important}/* самоисключение — список действий, а не варианты выбора */#sheet .exl .mi{min-height:46px;color:#7e0b12}#sheet .exl .mi .mr{font-size:18px;color:var(--sm)}/* бонус: пульт убран, компактный спин справа от суммы фриспина; поле плавно вытягивается на освободившуюся высоту */body.fs .controls .bet,body.fs .controls .btns{display:none !important}/* в бонусе кнопки спина нет совсем: ускорить показ можно тапом по полю */body.fs .controls{display:none !important}#board{transition:height .8s cubic-bezier(.3,.75,.25,1),width .8s cubic-bezier(.3,.75,.25,1)}/* верх в бонусе не двигается: строка «спин · итого» занимает ровно место строки «6 × 5 · MAX», поле начинается там же */body.fs .sub{margin-top:12px !important;height:26px !important;min-height:26px !important;padding-top:0 !important;padding-bottom:0 !important;box-sizing:border-box}body.fs #boardWrap{margin-top:10px !important}/* строка «спин · счётчики · итого» в бонусе всегда влезает: счётчики сжимаются, итог не уезжает за край */body.fs .sub{gap:8px !important}body.fs .sub #subR{flex:0 0 auto}body.fs .sub #subL{flex:0 1 auto;min-width:0}/* шкала спинов — между «спин N / M» и счётчиками, всегда видна; счётчики — справа, без растягивания */body.fs.tmOn .sub .meters,body.fs.cmOn .sub .meters{min-width:0;overflow:hidden;flex:0 1 auto !important;justify-content:flex-end}/* строка бонуса — три колонки: «спин N / M» слева, шкала строго по центру (фиксированная ширина), счётчики справа.Всё выровнено по центру по вертикали; счётчики компактные, поэтому влезают целиком и шкалу не задевают */body.fs .sub{display:grid !important;grid-template-columns:1fr 40% 1fr;align-items:center !important;column-gap:10px}body.fs .sub #subL{justify-self:start;line-height:1}body.fs .sub .fsprog{position:relative;width:100%;transform:none;left:auto;top:auto;align-self:center;grid-column:2;grid-row:1}/* тории и ромбики каскад
