ется: строка «спин · итого» занимает ровно место строки «6 × 5 · MAX», поле начинается там же */body.fs .sub{margin-top:12px !important;height:26px !important;min-height:26px !important;padding-top:0 !important;padding-bottom:0 !important;box-sizing:border-box}body.fs #boardWrap{margin-top:10px !important}/* строка «спин · счётчики · итого» в бонусе всегда влезает: счётчики сжимаются, итог не уезжает за край */body.fs .sub{gap:8px !important}body.fs .sub #subR{flex:0 0 auto}body.fs .sub #subL{flex:0 1 auto;min-width:0}/* шкала спинов — между «спин N / M» и счётчиками, всегда видна; счётчики — справа, без растягивания */body.fs.tmOn .sub .meters,body.fs.cmOn .sub .meters{min-width:0;overflow:hidden;flex:0 1 auto !important;justify-content:flex-end}/* строка бонуса — три колонки: «спин N / M» слева, шкала строго по центру (фиксированная ширина), счётчики справа.Всё выровнено по центру по вертикали; счётчики компактные, поэтому влезают целиком и шкалу не задевают */body.fs .sub{display:grid !important;grid-template-columns:1fr 40% 1fr;align-items:center !important;column-gap:10px}body.fs .sub #subL{justify-self:start;line-height:1}body.fs .sub .fsprog{position:relative;width:100%;transform:none;left:auto;top:auto;align-self:center;grid-column:2;grid-row:1}/* тории и ромбики каскада встают на место шкалы, по центру; шкала на это время прячется */body.fs.tmOn .sub .fsprog,body.fs.cmOn .sub .fsprog{visibility:hidden}body.fs.tmOn .sub .meters,body.fs.cmOn .sub .meters{grid-column:2;grid-row:1;justify-self:center;gap:7px !important;max-width:none !important;overflow:visible !important;flex:none !important}body.fs .sub .tmeter{gap:4px !important}body.fs .sub .tmeter i{width:15px !important;height:13px !important}body.fs .sub .cmeter{gap:4px !important}body.fs .sub .cmeter i{width:9px !important;height:9px !important}body.fs.tmOn.cmOn .sub .meters::before{height:11px}body.fs.tmOn .sub .tmeter,body.fs.cmOn .sub .cmeter{animation:mtrIn .35s ease-out}@keyframes mtrIn{from{opacit
