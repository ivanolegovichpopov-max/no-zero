.cell.win{animation:winflashd calc(.28s*var(--t)) ease-out !important}@keyframes winflashd{0%{background:var(--blood)}100%{background:#F6F3EE}}/* клякса легче и меньше */.splash{opacity:.45 !important;animation-duration:calc(.42s*var(--t)) !important}button,#spin{touch-action:manipulation}/* ожидание ответа: поле приподнято и дрожит */#board.lifting .cell>*,#app .cell.leaving>*{animation:liftShake .5s ease-in-out infinite alternate}@keyframes liftShake{0%{transform:translate(0,-3px)}25%{transform:translate(.6px,-4px)}50%{transform:translate(-.6px,-3.5px)}75%{transform:translate(.4px,-4.5px)}100%{transform:translate(-.4px,-4px)}}#app .cell.leaving{transition:transform calc(.3s*var(--t)) cubic-bezier(.55,0,.9,.6) var(--dl,0ms) !important}/* счётчик тории: тёмная плашка, белый значок, подпись словами */.torBadge{top:-14px !important;right:8px !important;border-radius:0 !important;background:var(--ink) !important;color:var(--paper) !important;font-size:10.5px !important;font-weight:800;letter-spacing:.14em;padding:4px 10px 4px 8px !important;gap:7px !important;align-items:center;box-shadow:none !important}.torBadge .tor{width:15px !important;height:14px !important;color:var(--paper) !important;filter:none !important;animation:none !important;flex:0 0 15px}.torBadge span{white-space:nowrap}/* без подложки под полем: луна видна между клетками */#board,body.dark #board,body.fs #board{background:transparent !important}/* счётчик тории — значками в строке над полем (в бонусе — в строке спинов) */.legend{position:relative}.legend .c{transition:opacity .25s}.tmeter{display:flex;gap:9px;align-items:center;pointer-events:none;opacity:0;transition:opacity .25s}.legend .tmeter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}body.tmOn .legend .c{opacity:0}body.tmOn .tmeter{opacity:1}.tmeter i{display:block;width:19px;height:17px;color:var(--ink);opacity:.22;transition:opacity .2s,color .2s}.tmeter i.on{color:var(--blood);opacity:1}.tmeter i.fl{animation:tmPop .55s cubic-bezier(.2,1.5,.4,1)}.tmeter .ti{width:100%;height:100%;display:block}@keyframes tmPop{0%{transform:scale(1.9);filter:drop-shadow(0 0 8px rgba(179,18,27,.9))}100%{transform:scale(1)}}.sub .tmeter{flex:0 0 auto}body.fs .tmeter i{color:#F6F3EE}body.fs .tmeter i.on{color:#FF4650}/* исчезающие клетки не становятся полупрозрачными: плитка схлопывается целиком */#app .cell.gone{opacity:1 !important;filter:none !important;transition:transform calc(.2s*var(--t)) cubic-bezier(.5,0,.75,0) !important}/* баланс при изменении вспыхивает белым, а не красным (на чёрной туши) */#bal.up{color:#fff !important;text-shadow:0 0 12px rgba(255,255,255,.55)}/* счётчики в строке над полем: тории значками, каскад ромбами; если оба — делят строку */.legend .meters{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:18px}.legend .tmeter{position:static !important;transform:none !important}.sub .meters{display:flex;align-items:center;gap:14px}.tmeter,.cmeter{display:none !important;opacity:1 !important}body.tmOn .tmeter{display:flex !important}body.cmOn .cmeter{display:flex !important}body.tmOn .legend .c,body.cmOn .legend .c{opacity:0}.cmeter{gap:7px;align-items:center}.cmeter i{display:block;width:11px;height:11px;color:var(--blood)}.cmeter svg{width:100%;height:100%;display:block}.cmeter i.fl{animation:tmPop .55s cubic-bezier(.2,1.5,.4,1)}body.fs .cmeter i{color:#FF4650}body.tmOn.cmOn .meters::before{content:"";order:1;width:1px;height:14px;background:var(--ink);opacity:.3}body.tmOn.cmOn .cmeter{order:2}.cascBadge{display:none !important}/* ромбы каскада — цветом туши с бумажной обводкой: видны и на бумаге, и на луне */.cmeter i{color:var(--ink) !important;width:13px !important;height:13px !important}body.fs .cmeter i{color:#F6F3EE !important}body.fs .cmeter path{stroke:#141414}/* печать 血 — wild: красная печать-ханко */.seal{display:grid;place-items:center;background:var(--blood);color:#fff;font-family:'Shippori Mincho B1',serif;font-weight:800;line-height:1;border-radius:4px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.28),0 2px 8px rgba(179,18,27,.35);transform:rotate(-4deg)}#app .cell.wild{background:var(--plate)}#app .cell.wildhit .seal{animation:sealHit .45s cubic-bezier(.2,1.6,.4,1);box-shadow:inset 0 0 0 2px rgba(255,255,255,.5),0 0 18px rgba(179,18,27,.85)}#app .cell.wildhit{box-shadow:0 0 0 2px var(--blood)}@keyframes sealHit{0%{transform:rotate(-4deg) scale(1.35)}100%{transform:rotate(-4deg) scale(1)}}#app .cell.stuck .seal{animation:sealStay .6s ease-out}@keyframes sealStay{0%{box-shadow:0 0 0 0 rgba(179,18,27,.9)}100%{box-shadow:0 0 0 14px rgba(179,18,27,0)}}/* «Затмение» — сцена */.eclipse{position:absolute;inset:-14px;z-index:6;pointer-events:none;overflow:visible}.eclipse .ecl-clip{position:absolute;inset:0;overflow:hidden}.eclipse .ecl-dark{position:absolute;inset:0;background:rgba(10,6,6,.0);transition:background .6s}.eclipse.s1 .ecl-dark{background:rgba(10,6,6,.42)}.eclipse .ecl-moon{position:absolute;width:115%;aspect-ratio:1;border-radius:50%;right:-120%;top:-60%;background:radial-gradient(circle at 45% 45%,rgba(20,6,8,.88) 0,rgba(20,6,8,.82) 58%,rgba(179,18,27,.55) 66%,rgba(179,18,27,0) 72%);transition:right 1s cubic-bezier(.3,0,.2,1),top 1s cubic-bezier(.3,0,.2,1)}.eclipse.s2 .ecl-moon{right:30%;top:-48%}.eclipse .ecl-txt{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%) scale(.92);text-align:center;color:#fff;font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:30px;letter-spacing:.28em;padding:14px 0;opacity:0;background:linear-gradient(90deg,transparent,rgba(10,6,6,.82) 18%,rgba(10,6,6,.82) 82%,transparent);text-shadow:0 0 18px rgba(179,18,27,.9);transition:opacity .4s,transform .4s,top .5s}.eclipse.s1 .ecl-txt{opacity:1;transform:translateY(-50%) scale(1)}.eclipse.s3 .ecl-txt{top:calc(100% + 28px);z-index:9;font-size:22px;padding:8px 0;background:rgba(10,6,6,.92)}#board.eclipsing{z-index:30 !important}.eclipse .ecl-txt small{display:block;font-family:'Manrope',sans-serif;font-size:14px;font-weight:800;letter-spacing:.12em;margin-top:6px;opacity:0;transition:opacity .4s}.eclipse.s3 .ecl-txt small{opacity:1}.eclipse.out{opacity:0;transition:opacity .6s}#board.eclipsing #reels{filter:none}#app .cell.ecl-target{z-index:7;box-shadow:0 0 0 2px #FF4650,0 0 16px rgba(255,70,80,.7);animation:eclPulse .5s ease-in-out infinite alternate}@keyframes eclPulse{from{box-shadow:0 0 0 2px #FF4650,0 0 8px rgba(255,70,80,.5)}to{box-shadow:0 0 0 3px #FF4650,0 0 22px rgba(255,70,80,.9)}}#app .cell.ecl-new{z-index:7;box-shadow:0 0 0 2px #FF4650}.ecl-sweep{position:absolute;z-index:8;pointer-events:none;background:linear-gradient(90deg,#141414 0,#141414 70%,rgba(20,20,20,0));transform-origin:left center;animation:inkSweep .26s cubic-bezier(.5,0,.5,1) forwards}@keyframes inkSweep{0%{transform:scaleX(0);opacity:1}55%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1) translateX(30%);opacity:0}}#app .cell.morph{animation:morph .5s ease-out}@keyframes morph{0%{filter:brightness(2.2) blur(2px)}100%{filter:none}}/* ===== гипнотическое поле ===== *//* покой: символы чуть дышат волной по колонкам */#app .cell.hi:not(.win):not(.dim) .g{animation:breathe 4.8s ease-in-out infinite}#app .cell.lo:not(.win):not(.dim) .g{animation:breathe 6.4s ease-in-out infinite}@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}#board.moving .cell .g{animation:none !important}/* выигрыш старших символов: у каждого свой жест */#app .cell.win[data-s="0"] .g{animation:oni .7s ease-out}@keyframes oni{0%{transform:scale(1.25)}20%{transform:scale(1.15) rotate(-6deg)}40%{transform:scale(1.15) rotate(6deg)}60%{transform:scale(1.1) rotate(-3deg)}100%{transform:scale(1)}}#app .cell.win[data-s="1"] .g{animation:katana .6s cubic-bezier(.2,1.4,.4,1)}@keyframes katana{0%{transform:rotate(-35deg) scale(.9)}60%{transform:rotate(8deg) scale(1.15)}100%{transform:none}}#app .cell.win[data-s="2"] .g{animation:crane .8s ease-in-out}@keyframes crane{0%,100%{transform:none}25%{transform:scaleY(.75) translateY(4%)}50%{transform:scaleY(1.12) translateY(-6%)}75%{transform:scaleY(.85)}}#app .cell.win[data-s="3"] .g{animation:fan .6s cubic-bezier(.2,1.5,.4,1)}@keyframes fan{0%{transform:scaleX(.25)}100%{transform:none}}/* мелкий выигрыш (меньше ставки) — без вспышки */#board.soft .cell.win{animation:none !important;box-shadow:none !important}/* нарастание каскада: края экрана затягивает кровавой тушью */.vign{position:absolute;inset:0;pointer-events:none;z-index:0;opacity:calc(var(--heat,0) * .9);transition:opacity .6s ease-out;background:radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(120,8,14,.22) 72%,rgba(60,4,8,.55) 100%)}#moon{filter:brightness(calc(1 + var(--heat,0) * .25)) saturate(calc(1 + var(--heat,0) * .3))}/* посадка луны-множителя: круги по воде */#app .cell.ripple::after{content:"";position:absolute;inset:10%;border-radius:50%;border:2px solid var(--blood);animation:ripple 1.1s ease-out forwards;pointer-events:none}#app .cell.ripple::before{content:"";position:absolute;inset:10%;border-radius:50%;border:1.5px solid var(--blood);animation:ripple 1.1s .18s ease-out forwards;pointer-events:none;opacity:0}@keyframes ripple{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}/* крупный выигрыш: экран заливает кровавой тушью из-за краёв */.ov.bw{background:rgba(10,6,6,.86)}.ov.bw::before{content:"";position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 30%,rgba(179,18,27,.55) 60%,rgba(90,6,10,.9) 85%);animation:inkFlood 1.4s cubic-bezier(.2,.7,.3,1) forwards}@keyframes inkFlood{0%{transform:scale(1.6);opacity:0}100%{transform:scale(1);opacity:1}}/* «Затмение»: надпись на полосе тени */.eclipse .ecl-txt{font-size:24px !important;letter-spacing:.24em !important;padding:12px 0;background:linear-gradient(90deg,transparent,rgba(10,6,6,.72) 20%,rgba(10,6,6,.72) 80%,transparent)}.eclipse .ecl-txt small{font-size:20px !important}/* печать 血 — особенная: чёрная печать туши, красный иероглиф, красная кайма и медленный отблеск */.seal{position:relative;overflow:hidden;background:#0E0B0A !important;color:#E3242E !important;border-radius:3px !important;box-shadow:inset 0 0 0 1.5px #B3121B,inset 0 0 0 4px #0E0B0A,inset 0 0 0 5px rgba(179,18,27,.55),0 3px 10px rgba(0,0,0,.35) !important;text-shadow:0 0 10px rgba(227,36,46,.55)}.seal::after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.22) 50%,transparent 58%);animation:sealShine 3.6s ease-in-out infinite;pointer-events:none}@keyframes sealShine{0%,60%{transform:translateX(-60%)}100%{transform:translateX(60%)}}body.dark .seal,body.fs .seal{box-shadow:inset 0 0 0 1.5px #E3242E,inset 0 0 0 4px #0E0B0A,inset 0 0 0 5px rgba(227,36,46,.6),0 0 14px rgba(227,36,46,.45) !important}#app .cell.wild{background:var(--plate)}#app .cell.wildhit .seal{box-shadow:inset 0 0 0 2px #FF4650,inset 0 0 0 4px #0E0B0A,0 0 22px rgba(255,70,80,.9) !important}/* удар катаной */.slash{position:absolute;height:4px;margin-top:-2px;z-index:9;pointer-events:none;transform-origin:center;background:linear-gradient(90deg,transparent 0,#fff 12%,#fff 88%,transparent 100%);box-shadow:0 2px 0 rgba(179,18,27,.95),0 0 14px rgba(255,255,255,.9),0 4px 10px rgba(179,18,27,.6);clip-path:inset(0 100% 0 0);animation:slashIn .14s cubic-bezier(.6,0,.4,1) forwards,slashOut .5s .18s ease-out forwards}.slash.rev{clip-path:inset(0 0 0 100%)}@keyframes slashIn{to{clip-path:inset(0 0 0 0)}}@keyframes slashOut{to{opacity:0;height:1px}}.bdrop{position:absolute;z-index:8;pointer-events:none;background:#9E0B14;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;opacity:0;animation:bdrop .9s cubic-bezier(.3,0,.6,1) forwards}@keyframes bdrop{0%{opacity:.95;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1)}}#app .cell.half{z-index:4;pointer-events:none}/* кровь луны-множителя */.blood{position:absolute;z-index:6;pointer-events:none;background:#A10C16;opacity:.92;box-shadow:inset -1px -2px 3px rgba(0,0,0,.25);animation:blood 2.3s cubic-bezier(.2,.8,.3,1) forwards}@keyframes blood{0%{transform:translate(0,0) scale(.3);opacity:.95}18%{transform:translate(var(--tx),var(--ty)) scale(1);opacity:.92}70%{opacity:.75}100%{transform:translate(var(--tx),calc(var(--ty) + 6px)) scale(1.08);opacity:0}}#app .cell.ripple::after,#app .cell.ripple::before{display:none !important}.splash{display:none !important}/* «Затмение» v3: на языке слота */.eshade-wrap{position:absolute;z-index:1;border-radius:50%;overflow:hidden;pointer-events:none}.eshade{position:absolute;inset:-2%;border-radius:50%;background:radial-gradient(circle at 55% 50%,#0B0707 0,#0B0707 62%,#1a0608 80%,rgba(11,7,7,.9) 100%);transform:translateX(-108%);transition:transform 1.3s cubic-bezier(.45,0,.25,1)}.eshade-wrap.on .eshade{transform:translateX(-7%)}.edim{position:absolute;inset:0;z-index:3;pointer-events:none;background:rgba(8,5,5,0);transition:background .8s}.edim.on{background:rgba(8,5,5,.55)}.eband{position:absolute;left:0;right:0;z-index:32;pointer-events:none;background:center/100% 100% no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#F6F3EE;opacity:0;transform:translateX(30px);transition:opacity .4s,transform .5s cubic-bezier(.2,.8,.2,1)}.eband.on{opacity:1;transform:none}.eband b{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:24px;letter-spacing:.3em;text-shadow:0 0 14px rgba(179,18,27,.8)}.eband span{font-family:'Manrope',sans-serif;font-weight:800;font-size:13px;letter-spacing:.1em;color:#FF6B73}.ink{position:absolute;z-index:7;pointer-events:none;background:#0E0B0A;transform:scale(0);box-shadow:0 0 0 2px rgba(14,11,10,.4),0 0 12px rgba(179,18,27,.35);animation:inkIn .45s cubic-bezier(.2,1.3,.4,1) forwards}@keyframes inkIn{0%{transform:scale(0) rotate(-10deg)}100%{transform:scale(1) rotate(0)}}.ink.off{animation:inkOff .6s cubic-bezier(.5,0,.75,0) forwards}@keyframes inkOff{0%{transform:scale(1);clip-path:inset(0 0 0 0);opacity:1}100%{transform:scale(1) translateY(28%);clip-path:inset(100% 0 0 0);opacity:.6}}</style>
</head>
<body>
<div id="gate"><div class="m"><span>血月</span></div><div class="bar"><i></i></div><div id="gateMsg" style="font-weight:600;max-width:300px"></div></div>

<div id="app">
  <div id="moon" aria-hidden="true"></div>
  <div id="replayTag"></div>
  <div id="petals" aria-hidden="true"></div>
  <div class="mist2" aria-hidden="true"></div>
  <div class="vign" aria-hidden="true"></div>
  <div class="top">
    <div class="l"><span class="k">血月</span><span class="n">BLOOD MOON<br>SLOT</span></div>
    <div class="bal" id="balBtn" role="button" tabindex="0"><b><svg class="coin" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="#B3121B"/><circle cx="10" cy="10" r="5.5" fill="none" stroke="#fff" stroke-width="1.6" stroke-dasharray="2.2 1.6"/></svg><span id="bal">—</span></b></div>
  </div>
  <div id="fshead"><span class="lbl" data-t="totalMult"></span><span class="k" id="fsMult">×0</span></div>
  <div class="sub"><span id="subL"></span><div class="meters"><div class="tmeter"></div><div class="cmeter"></div></div><span id="subR"></span></div>
  <div class="legend"><div class="c"><i class="o"></i><span>6 × 5</span><i></i><span>MAX ×5000</span><i class="o"></i></div><div class="meters"><div class="tmeter"></div><div class="cmeter"></div></div></div>
  <div id="boardWrap"><div id="board"><div id="reels"></div><div id="fx"></div><div class="torBadge" id="torBadge"></div><div class="cascBadge" id="cascBadge"></div></div></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><radialGradient id="moonG" cx="36%" cy="32%" r="70%"><stop offset="0" stop-color="#D8222C"/><stop offset=".55" stop-color="#8E0E16"/><stop offset="1" stop-color="#4A070C"/></radialGradient></defs></svg>
  <div id="dots" aria-hidden="true"></div>
  <div class="winbar">
    <div><span class="lbl" id="winLbl"></span><b><span id="win">0,00</span></b></div>
    <div class="chip" id="chip">×0</div>
    <button class="chip" id="shareBtn" aria-label="Share">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2v10M5 6l4-4 4 4M3 11v4h12v-4"/></svg>
    </button>
  </div>
  <div class="controls">
    <div class="row">
      <div class="bet">
        <span class="lbl" id="betLbl"></span>
        <div class="r">
          <button class="round" id="betDn" aria-label="−">−</button>
          <b id="bet">—</b>
          <button class="round" id="betUp" aria-label="+">+</button>
        </div>
      </div>
      <div class="spinWrap">
        <button id="spin" aria-label="Spin">
          <svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle id="ringC" cx="50" cy="50" r="48"/></svg>
          <svg class="spinIc" width="36" height="36" viewBox="0 0 38 38" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M31 19a12 12 0 1 1-4-9"/><path d="M28 4v7h-7"/></svg>
          <span class="stopIc" aria-hidden="true"></span>
        </button>
        <span class="cost" id="spinCost"></span>
      </div>
    </div>
    <div class="btns">
      <button class="ic" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 5h14M2 9h14M2 13h14"/></svg></button>
      <button class="ic" id="autoBtn" aria-label="Auto"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a7 7 0 0 1 12-5M17 10a7 7 0 0 1-12 5"/><path d="M15 2v3h-3M5 18v-3h3"/></svg><span id="autoN" style="display:none;font-size:11px"></span></button>
      <button class="ic" id="turboBtn" aria-label="Turbo"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M11 2 4 11h5l-1 7 7-9h-5z"/></svg></button>
      <button class="ante" id="anteBtn"><span><span data-t="chance"></span> <small id="anteCost"></small></span><span class="sw" aria-hidden="true"></span></button>
      <button class="buy" id="buyBtn" data-t="bonus"></button>
    </div>
    <div class="foot">
      <div class="ics">
        <button class="icon-btn" id="sndBtn" aria-label="Sound">
          <svg id="sndOn" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h3l4-3v10l-4-3H3z"/><path d="M13 7.5a3.5 3.5 0 0 1 0 5M15.5 5a7 7 0 0 1 0 10"/></svg>
          <svg id="sndOff" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M3 8h3l4-3v10l-4-3H3z"/><path d="M13 8l4 4M17 8l-4 4"/></svg>
        </button>
      </div>
      <span class="info" data-t="foot"></span><button class="lnk" id="rulesBtn" data-t="rules"></button>
    </div>
  </div>
</div>

<div id="tip" role="tooltip"></div>
<div class="ov" id="ov"><div class="box" id="ovBox"></div></div>
<div id="onb" role="dialog" aria-modal="true">
  <div class="pic" id="onbPic"></div>
  <h2 id="onbT"></h2><p id="onbD"></p>
  <div class="nav"><button class="skip" id="onbSkip"></button><div class="dots" id="onbDots"></div><button class="nx" id="onbNext"></button></div>
</div>
<div class="shade" id="shade"></div>

  <header><b id="sheetTitle"></b><button class="icon-btn" id="sheetClose" aria-label="Close" style="border-color:#141414;background:#F6F3EE;color:#141414">✕</button></header>
  <div class="body" id="sheetBody"></div>
</section>
