-through;text-decoration-thickness:1px}#sheet .cempty{color:var(--sm);font-size:14px;padding-top:14px}#sheet .ctest{text-align:left;font-size:11px;color:var(--sm);margin:10px 0 0;visibility:hidden}/* экран загрузки: луна, подпись и мазок туши, который заполняется по мере настоящей загрузки */#gate{background:radial-gradient(ellipse 90% 70% at 50% 42%,#F8F5F0 0,#F2EEE7 70%,#E9E3DA 100%) !important;gap:0 !important}#gate .gm{display:flex;flex-direction:column;align-items:center;gap:22px;animation:gateIn .9s cubic-bezier(.2,.8,.2,1) both}#gate .m{width:124px;height:124px;animation:none !important;box-shadow:0 18px 40px -18px rgba(142,14,22,.55);transition:transform .7s cubic-bezier(.3,1.3,.5,1)}#gate .m span{font-size:46px;letter-spacing:-.02em}#gate .gt{font-family:'Manrope',sans-serif;font-weight:800;font-size:11px;letter-spacing:.42em;margin-right:-.42em;color:#141414}#gate .gbar{position:relative;width:172px;height:7px;margin-top:34px;-webkit-mask:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 60 6%27 preserveAspectRatio=%27none%27%3E%3Cpath d=%27M2.0%201.2%20L3.9%201.3%20L5.7%201.5%20L7.6%201.6%20L9.5%201.7%20L11.3%201.9%20L13.2%202.0%20L15.1%202.1%20L16.9%202.2%20L18.8%202.3%20L20.7%202.4%20L22.5%202.5%20L24.4%202.6%20L26.3%202.7%20L28.1%202.7%20L30.0%202.8%20L31.9%202.8%20L33.7%202.9%20L35.6%202.9%20L37.5%202.9%20L39.3%202.9%20L41.2%202.9%20L43.1%202.9%20L44.9%202.9%20L46.8%202.9%20L48.7%202.8%20L50.5%202.8%20L52.4%202.8%20L54.3%202.7%20L56.1%202.7%20L58.0%202.6%20L58.0%203.4%20L56.1%203.6%20L54.3%203.7%20L52.4%203.8%20L50.5%204.0%20L48.7%204.1%20L46.8%204.2%20L44.9%204.3%20L43.1%204.5%20L41.2%204.6%20L39.3%204.7%20L37.5%204.7%20L35.6%204.8%20L33.7%204.9%20L31.9%205.0%20L30.0%205.0%20L28.1%205.0%20L26.3%205.1%20L24.4%205.1%20L22.5%205.1%20L20.7%205.1%20L18.8%205.1%20L16.9%205.1%20L15.1%205.1%20L13.2%205.0%20L11.3%205.0%20L9.5%205.0%20L7.6%204.9%20L5.7%204.9%20L3.9%204.8%20L2.0%204.8Z%27/%3E%3C/svg%3E") 0 0/100% 100% no-repea
