eight:800;line-height:1;border-radius:4px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.28),0 2px 8px rgba(179,18,27,.35);transform:rotate(-4deg)}#app .cell.wild{background:var(--plate)}#app .cell.wildhit .seal{animation:sealHit .45s cubic-bezier(.2,1.6,.4,1);box-shadow:inset 0 0 0 2px rgba(255,255,255,.5),0 0 18px rgba(179,18,27,.85)}#app .cell.wildhit{box-shadow:0 0 0 2px var(--blood)}@keyframes sealHit{0%{transform:rotate(-4deg) scale(1.35)}100%{transform:rotate(-4deg) scale(1)}}#app .cell.stuck .seal{animation:sealStay .6s ease-out}@keyframes sealStay{0%{box-shadow:0 0 0 0 rgba(179,18,27,.9)}100%{box-shadow:0 0 0 14px rgba(179,18,27,0)}}/* «Затмение» */.eclipse{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}.eclipse .ecl-moon{position:absolute;top:50%;width:140%;aspect-ratio:1;border-radius:50%;left:-160%;transform:translateY(-50%);background:radial-gradient(circle,rgba(10,6,6,.0) 0,rgba(10,6,6,.55) 45%,rgba(10,6,6,.75) 60%,rgba(10,6,6,0) 72%);animation:eclPass 1.6s cubic-bezier(.45,0,.3,1) forwards}@keyframes eclPass{to{left:120%}}.eclipse .ecl-txt{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#fff;font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:30px;letter-spacing:.3em;text-shadow:0 0 18px rgba(179,18,27,.9),0 2px 8px rgba(0,0,0,.6);opacity:0;animation:eclTxt 1.8s ease-out forwards}.eclipse .ecl-txt small{display:block;font-size:22px;letter-spacing:.2em;margin-top:6px}@keyframes eclTxt{0%{opacity:0;transform:translateY(-40%) scale(.9)}20%{opacity:1;transform:translateY(-50%) scale(1)}80%{opacity:1}100%{opacity:0}}.eclipse.out{opacity:0;transition:opacity .5s}#board.eclipsing #reels{filter:brightness(.7) saturate(.8);transition:filter .4s}#app .cell.morph{animation:morph .5s ease-out}@keyframes morph{0%{filter:brightness(2.2) blur(2px)}100%{filter:none}}/* ===== гипнотическое поле ===== *//* покой: символы чуть дышат волной по колонкам */#app .cell.hi:not(.win):not(.dim) .g{animation:breathe 4.8s ease-in-out infinite}#app .cell.lo:not(.win):not(.dim) .g{animation:breathe 6.4s ease-in-out infinite}@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}#board.moving .cell .g{animation:none !important}/* выигрыш старших символов: у каждого свой жест */#app .cell.win[data-s="0"] .g{animation:oni .7s ease-out}@keyframes oni{0%{transform:scale(1.25)}20%{transform:scale(1.15) rotate(-6deg)}40%{transform:scale(1.15) rotate(6deg)}60%{transform:scale(1.1) rotate(-3deg)}100%{transform:scale(1)}}#app .cell.win[data-s="1"] .g{animation:katana .6s cubic-bezier(.2,1.4,.4,1)}@keyframes katana{0%{transform:rotate(-35deg) scale(.9)}60%{transform:rotate(8deg) scale(1.15)}100%{transform:none}}#app .cell.win[data-s="2"] .g{animation:crane .8s ease-in-out}@keyframes crane{0%,100%{transform:none}25%{transform:scaleY(.75) translateY(4%)}50%{transform:scaleY(1.12) translateY(-6%)}75%{transform:scaleY(.85)}}#app .cell.win[data-s="3"] .g{animation:fan .6s cubic-bezier(.2,1.5,.4,1)}@keyframes fan{0%{transform:scaleX(.25)}100%{transform:none}}/* мелкий выигрыш (меньше ставки) — без вспышки */#board.soft .cell.win{animation:none !important;box-shadow:none !important}/* нарастание каскада: края экрана затягивает кровавой тушью */.vign{position:absolute;inset:0;pointer-events:none;z-index:0;opacity:calc(var(--heat,0) * .9);transition:opacity .6s ease-out;background:radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(120,8,14,.22) 72%,rgba(60,4,8,.55) 100%)}#moon{filter:brightness(calc(1 + var(--heat,0) * .25)) saturate(calc(1 + var(--heat,0) * .3))}/* посадка луны-множителя: круги по воде */#app .cell.ripple::after{content:"";position:absolute;inset:10%;border-radius:50%;border:2px solid var(--blood);animation:ripple 1.1s ease-out forwards;pointer-events:none}#app .cell.ripple::before{content:"";position:absolute;inset:10%;border-radius:50%;border:1.5px solid var(--blood);animation:ripple 1.1s .18s ease-out forwards;pointer-events:none;opacity:0}@keyframes ripple{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}/* крупный выигрыш: экран заливает кровавой тушью из-за краёв */.ov.bw{background:rgba(10,6,6,.86)}.ov.bw::before{content:"";position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 30%,rgba(179,18,27,.55) 60%,rgba(90,6,10,.9) 85%);animation:inkFlood 1.4s cubic-bezier(.2,.7,.3,1) forwards}@keyframes inkFlood{0%{transform:scale(1.6);opacity:0}100%{transform:scale(1);opacity:1}}/* «Затмение»: надпись на полосе тени */.eclipse .ecl-txt{font-size:24px !important;letter-spacing:.24em !important;padding:12px 0;background:linear-gradient(90deg,transparent,rgba(10,6,6,.72) 20%,rgba(10,6,6,.72) 80%,transparent)}.eclipse .ecl-txt small{font-size:20px !important}</style>
