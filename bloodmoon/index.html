p .cell.hi:not(.win):not(.dim) .g,#app .cell.lo:not(.win):not(.dim) .g{animation:none}#app .cell:not(.win) .tor{animation:none}#app .cell:not(.win) .orb:not(.wait){animation:none}.winbar.near{animation:none}/* === один акцент: старшие символы — тонкая красная рамка вместо розовой заливки === */#app .cell.hi:not(.win){background:var(--plate) !important;box-shadow:inset 0 0 0 1.5px rgba(179,18,27,.55)}body.dark #app .cell.hi:not(.win),body.fs #app .cell.hi:not(.win){background:var(--plate) !important;box-shadow:inset 0 0 0 1px rgba(255,70,80,.22)}#app .cell.hi.dim{box-shadow:inset 0 0 0 1.5px rgba(179,18,27,.18)}/* во время выигрыша всё красное вокруг поля уходит в тень — красной остаётся только комбинация */#spin,#buyBtn{transition:opacity .45s ease,filter .45s ease}body.winning #spin,body.winning #buyBtn{opacity:.38;filter:grayscale(.85)}/* === эскалация: крупный выигрыш — луна наливается кровью, сумма проявляется кистью === */body.bwx #moon{filter:saturate(1.35) brightness(1.08);box-shadow:0 0 90px rgba(179,18,27,.6),0 0 180px rgba(179,18,27,.35);transition:filter .5s ease,box-shadow .5s ease}body.bwx #board{filter:brightness(.55) saturate(.6);transition:filter .5s ease}.ov .cnt.brush{font-family:'Shippori Mincho B1',serif;font-size:58px;letter-spacing:.01em;animation:brushIn .9s cubic-bezier(.3,.6,.2,1) .25s both}@keyframes brushIn{from{clip-path:inset(-10% 100% -10% 0);opacity:.3}to{clip-path:inset(-10% 0 -10% 0);opacity:1}}.ov .bwstroke{display:block;width:min(300px,78vw);height:14px;margin:6px auto 0;overflow:visible}.ov .bwstroke path{fill:none;stroke:#B3121B;stroke-width:5;stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:1;animation:strokeIn .8s cubic-bezier(.4,0,.2,1) .7s forwards}@keyframes strokeIn{to{stroke-dashoffset:0}}/* линия удара через весь экран */.scrcut{position:fixed;height:1.5px;margin-top:-.75px;z-index:57;pointer-events:none;transform-origin:center;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95) 12%,#fff 50%,rgba(255,255,255,.95) 88%,transparent);box-shadow:0 0 6px 1px rgba(255,255,255,.8),0 0 18px 2px rgba(200,20,30,.35)}body:not(.dark):not(.fs) .scrcut{background:linear-gradient(90deg,transparent,rgba(160,10,20,.85) 12%,#B3121B 50%,rgba(160,10,20,.85) 88%,transparent);box-shadow:0 0 0 .5px rgba(255,255,255,.9),0 0 10px 1px rgba(179,18,27,.35)}.scrcut.strong{height:2px}/* === ненужные знаки растворяются в бумаге (в бонусе — в темноте), выигрыш чуть приподнимается === */html body #app .cell.dim,html body #app .cell.adim{filter:none !important;background:color-mix(in srgb,var(--plate) 45%,var(--paper) 55%) !important;box-shadow:none !important;transition:background-color calc(.65s*var(--t)) cubic-bezier(.45,0,.3,1)}html body #app .cell.dim>*,html body #app .cell.adim>*{opacity:.13 !important;filter:none !important}html body #board.hush .cell:not(.win):not(.half){filter:none !important}html body #board.hush .cell:not(.win):not(.half):not(.dim)>*{opacity:.13}body.fs #app .cell.dim,body.fs #app .cell.adim,body.dark #app .cell.dim,body.dark #app .cell.adim{background:color-mix(in srgb,var(--plate) 35%,var(--paper) 65%) !important}body.fs #app .cell.dim>*,body.fs #app .cell.adim>*,body.dark #app .cell.dim>*,body.dark #app .cell.adim>*{opacity:.16 !important}/* в ожидании тории остаются чёткими и красными */html body #app .cell.adim.tbeat,html body #app .cell.tbeat{background:var(--plate) !important}html body #app .cell.tbeat>*{opacity:1 !important}/* выигрышные плитки приподнимаются: чуть крупнее и с мягкой тенью *//* подъём выигрыша строго на месте: плитка не масштабируется (её transform — это её позиция), а «растёт» каймой своего цветаво все стороны от центра; знак внутри чуть крупнее; мягкая тень снизу */#app #reels .cell.win:not(.half){z-index:3;box-shadow:0 7px 14px rgba(90,6,10,.26),0 1px 3px rgba(90,6,10,.22);transition:box-shadow calc(.5s*var(--t)) ease,background-color calc(.32s*var(--t)) cubic-bezier(.3,0,.2,1),transform calc(.45s*var(--t)) cubic-bezier(.3,1.25,.5,1) !important}#app .cell.half.win{box-shadow:none}/* строка над полем постоянной высоты: смена текста на значки тории/множителя не сдвигает поле */body:not(.fs) .legend{height:26px;min-height:26px;max-height:26px;box-sizing:border-box;overflow:visible}/* третий тории: тории вспыхивают по цепочке; почти попадание: красный медленно гаснет */#app .cell.trig{background:var(--plate) !important}#app .cell.trig .tor{filter:drop-shadow(0 0 8px rgba(179,18,27,.55))}#app .cell.tmiss .tor{animation:tmiss 1.4s ease-out both}@keyframes tmiss{0%{filter:drop-shadow(0 0 8px rgba(179,18,27,.5));opacity:1}45%{opacity:.45;filter:none}100%{opacity:1;filter:none}}/* брызги у вайлдов гаснут, как только начинается подсветка выигрыша */#fx .bsplat.spr{transition:opacity .35s ease}body.winning #fx .bsplat.spr{opacity:0 !important}/* стекло с кровью поверх всей игры, не перехватывает касания */#glass{position:fixed;inset:0;z-index:19;pointer-events:none;overflow:hidden}#glass .gdrop,#glass .grun{position:absolute;filter:drop-shadow(0 1px 1px rgba(40,0,0,.25))}#glass .old{opacity:.5;transition:opacity 1.1s ease}#glass .old svg{filter:brightness(.58) saturate(.6) sepia(.25);transition:filter 1.1s ease}#glass .old .gh{opacity:0}/* ожидание тории: живые колонки — размытый крутящийся барабан */.antcol{overflow:hidden}.antcol .astrip{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;align-items:center;filter:blur(1.6px);opacity:.55}.antcol .astrip i{display:flex;align-items:center;justify-content:center;height:var(--ch);flex:0 0 var(--ch);color:var(--ink);transform:scaleY(1.35)}body.fs .antcol .astrip i{color:#F6F3EE}/* луна и края экрана дышат в такт; луна краснеет с каждой колонкой */body.abeat #moon{animation:moonbeat var(--beat,.62s) ease-in-out infinite;filter:saturate(calc(.8 + var(--mk,1) * .25)) brightness(calc(.95 + var(--mk,1) * .05))}@keyframes moonbeat{0%,100%{box-shadow:0 0 calc(30px * var(--mk,1)) rgba(179,18,27,.35)}14%{box-shadow:0 0 calc(70px * var(--mk,1)) rgba(179,18,27,.7)}28%{box-shadow:0 0 calc(34px * var(--mk,1)) rgba(179,18,27,.4)}42%{box-shadow:0 0 calc(55px * var(--mk,1)) rgba(179,18,27,.55)}}#moon{transition:top 1.1s cubic-bezier(.2,.8,.2,1),right 1.1s cubic-bezier(.2,.8,.2,1),width 1.1s cubic-bezier(.2,.8,.2,1),height 1.1s cubic-bezier(.2,.8,.2,1),box-shadow 1.2s,opacity .6s,scale .9s ease-out,filter 1.2s ease}body::after{content:'';position:fixed;inset:0;z-index:18;pointer-events:none;opacity:0;transition:opacity .6s ease;background:radial-gradient(ellipse 75% 70% at 60% 52%,transparent 45%,rgba(40,0,4,.38) 85%,rgba(30,0,3,.6) 100%)}body.abeat::after{opacity:1;animation:vigbeat var(--beat,.62s) ease-in-out infinite}@keyframes vigbeat{0%,100%{opacity:.75}14%{opacity:1}28%{opacity:.8}42%{opacity:.92}}/* === бонус: тот же минимализм === */#fshead .k.idle{color:rgba(246,243,238,.4)}body.fs #balBtn{opacity:.5;transition:opacity .5s}body.fs .sub #subR b{font-size:20px}body.fs .sub #subL{opacity:.6}/* в фриспинах ставка и нижние кнопки не нужны — уходят, не сдвигая поле; остаётся кнопка спина (пропуск) */.controls .bet,.controls .btns,#spinCost{transition:opacity .5s ease,visibility .5s}body.fs .controls .bet,body.fs .controls .btns,body.fs #spinCost{opacity:0;visibility:hidden;pointer-events:none}/* «×N» общего множителя проступает рядом с суммой и растворяется после умножения */.winbar .mulx{font-style:normal;font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:22px;color:#FF4650;margin-left:10px;display:inline-block;vertical-align:.25em;animation:mulIn .35s cubic-bezier(.2,1.4,.4,1) both}.winbar .mulx.out{animation:mulOut .4s ease-in forwards}@keyframes mulIn{from{opacity:0;transform:translateX(-8px) scale(.6)}to{opacity:1;transform:none}}@keyframes mulOut{to{opacity:0;transform:translateX(-14px) scale(.7);filter:blur(2px)}}/* бонус: сгоревшие луны тихо гаснут почти до следа; кровь читается на тёмно-красном *//* отданная или сгоревшая луна в бонусе — тонкое кольцо с тусклым значением, без заливки */#app .orb.spent,body.fs #app .orb.dead{opacity:1 !important;filter:none !important;animation:none !important}#app .orb.spent circle:first-of-type,body.fs #app .orb.dead circle:first-of-type{fill:transparent;stroke:rgba(255,70,80,.42);stroke-width:2.2;transition:fill .6s,stroke .6s}#app .orb.spent circle:nth-of-type(2),body.fs #app .orb.dead circle:nth-of-type(2){stroke:transparent}#app .orb.spent text,body.fs #app .orb.dead text{fill:rgba(246,243,238,.32)}body.fs #glass .gdrop svg,body.fs #glass .grun svg{filter:brightness(1.45) saturate(1.1) drop-shadow(0 0 1px rgba(255,235,235,.35))}body.fs .bfan.scr,body.fs #fx .bsplat,body.fs #fx .bspray,body.fs #fx .stain{filter:brightness(1.35) saturate(1.1)}body.fs .scrcut{height:2px}html body.fs #app .cell.dim>*,html body.fs #app .cell.adim>*{opacity:.1 !important}#ov .cnt.brush{color:#fff;line-height:1.05;margin-top:6px}</style>
