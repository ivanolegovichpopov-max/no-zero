.sub .tmeter{gap:4px !important}body.fs .sub .tmeter i{width:15px !important;height:13px !important}body.fs .sub .cmeter{gap:4px !important}body.fs .sub .cmeter i{width:9px !important;height:9px !important}body.fs.tmOn.cmOn .sub .meters::before{height:11px}body.fs.tmOn .sub .tmeter,body.fs.cmOn .sub .cmeter{animation:mtrIn .35s ease-out}@keyframes mtrIn{from{opacity:0;transform:scale(.85)}}/* на красной луне шкала должна читаться: светлая основа, белая заливка */body.fs .fsprog::before{background:rgba(255,255,255,.5)}body.fs .fsprog .fl{background:#fff;box-shadow:none}body.fs .fsprog .tk{background-image:linear-gradient(90deg,rgba(255,255,255,.6) 0,rgba(255,255,255,.6) 1px,transparent 1px);border-right-color:rgba(255,255,255,.6)}body.fs .sub .meters i,body.fs .sub .meters svg{flex-shrink:1}/* бонус: итог внизу справа, напротив выигрыша фриспина; вверху — только спины и счётчики */.fstot{display:none}body.fs .fstot{display:flex;flex-direction:column;align-items:flex-end;gap:0}body.fs .fstot .lbl{color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;line-height:1.3}body.fs .fstot b{font-family:'Shippori Mincho B1',serif;font-size:30px;font-weight:800;line-height:1.1;color:#FF4650;font-variant-numeric:tabular-nums}body.fs .fstot.up b{animation:omHit .6s ease-out}body.fs .sub #subR{display:none !important}body.fs .wgoal span{right:auto;left:50%;transform:translateX(-50%)}.wgoal{display:none !important}/* деления шкалы — отдельные штрихи, позиции задаёт скрипт в целых пикселях экрана */.fsprog .tk b{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.6)}/* след ушедшей луны: едва заметное прерывистое кольцо кистью, без числа — отпечаток, а не вернувшаяся луна */#app .orb.spent circle:first-of-type{fill:transparent !important;stroke:rgba(255,70,80,.24) !important;stroke-width:1.3 !important;stroke-dasharray:46 5 22 4 31 6;stroke-linecap:round}#app .orb.spent circle:nth-of-type(2){stroke:transparent !important}#
