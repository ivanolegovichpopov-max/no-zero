idth:0;overflow:hidden;flex:0 1 auto !important;justify-content:flex-end}/* строка бонуса — три колонки: «спин N / M» слева, шкала строго по центру (фиксированная ширина), счётчики справа.Всё выровнено по центру по вертикали; счётчики компактные, поэтому влезают целиком и шкалу не задевают */body.fs .sub{display:grid !important;grid-template-columns:1fr 40% 1fr;align-items:center !important;column-gap:10px}body.fs .sub #subL{justify-self:start;line-height:1}body.fs .sub .fsprog{position:relative;width:100%;transform:none;left:auto;top:auto;align-self:center;grid-column:2;grid-row:1}/* тории и ромбики каскада встают на место шкалы, по центру; шкала на это время прячется */body.fs.tmOn .sub .fsprog,body.fs.cmOn .sub .fsprog{visibility:hidden}body.fs.tmOn .sub .meters,body.fs.cmOn .sub .meters{grid-column:2;grid-row:1;justify-self:center;gap:7px !important;max-width:none !important;overflow:visible !important;flex:none !important}body.fs .sub .tmeter{gap:4px !important}body.fs .sub .tmeter i{width:15px !important;height:13px !important}body.fs .sub .cmeter{gap:4px !important}body.fs .sub .cmeter i{width:9px !important;height:9px !important}body.fs.tmOn.cmOn .sub .meters::before{height:11px}body.fs.tmOn .sub .tmeter,body.fs.cmOn .sub .cmeter{animation:mtrIn .35s ease-out}@keyframes mtrIn{from{opacity:0;transform:scale(.85)}}/* на красной луне шкала должна читаться: светлая основа, белая заливка */body.fs .fsprog::before{background:rgba(255,255,255,.5)}body.fs .fsprog .fl{background:#fff;box-shadow:none}body.fs .fsprog .tk{background-image:linear-gradient(90deg,rgba(255,255,255,.6) 0,rgba(255,255,255,.6) 1px,transparent 1px);border-right-color:rgba(255,255,255,.6)}body.fs .sub .meters i,body.fs .sub .meters svg{flex-shrink:1}/* бонус: итог внизу справа, напротив выигрыша фриспина; вверху — только спины и счётчики */.fstot{display:none}body.fs .fstot{display:flex;flex-direction:column;align-items:flex-end;gap:0}body.fs .fstot .lbl{color:var(--muted);font-size:10px;font-we ;color:var(--blood);font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:17px;animation:cpIn .25s ease-out}#sheet .camtRow:focus-within .lbs{display:none}#sheet .camtRow:focus-within .cok{display:block}#sheet .camt:focus{outline:none}#sheet .cform .opts{margin:6px 0 10px}#sheet .cform .opts button{font-size:15px;padding:0}#sheet .cform .opts{gap:4px 2px}@media (max-width:380px){#sheet .cform .opts button{font-size:14px}}#sheet .cform .opts button:disabled{color:var(--sl) !important}#sheet .cform .wide{margin-top:0}#sheet .chint{text-align:left;font-size:12px;color:var(--sm);margin:10px 0 0}#sheet .cpend{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:8px 14px;margin:0 0 8px;background:color-mix(in srgb,var(--blood) 8%,transparent);color:var(--si);font-size:14px;font-weight:600;line-height:1.35;animation:cpIn .45s cubic-bezier(.2,.8,.2,1)}#sheet .cpend button,#sheet .crow button{border:none;background:none;padding:6px 0;color:var(--blood);font:inherit;font-weight:800;white-space:nowrap}#sheet .crow button{padding:0;font-size:12px}@keyframes cpIn{from{opacity:0;transform:translateY(-6px)}}#sheet .crow{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:8px;min-height:52px;border-bottom:1px solid var(--sl)}#sheet .crow .t{color:var(--sm);font-size:12px;line-height:1.3;font-variant-numeric:tabular-nums}#sheet .crow .ck{display:flex;flex-direction:column;line-height:1.3}#sheet .crow .ck b{font-size:14px;font-weight:700;color:var(--si)}#sheet .crow .ck i{font-style:normal;font-size:12px;color:var(--sm)}#sheet .crow.pending .ck i{color:var(--blood)}#sheet .crow .ca{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:16px;color:var(--si);font-variant-numeric:tabular-nums;text-align:right}#sheet .crow.rejected .ca,#sheet .crow.cancelled .ca{color:var(--sm);text-decoration:line-through;text-decoration-thickness:1px}#sheet .cempty{color:var(--sm);font-size:14px;padding-top:14px}#sheet .ctest{text-align:left;font-size:11px;color:var(--sm);margin:10px 0 0;visibility:hidden}/* экран загрузки: луна, подпись и мазок туши, который заполняется по мере настоящей загрузки */#gate{background:radial-gradient(ellipse 90% 70% at 50% 42%,#F8F5F0 0,#F2EEE7 70%,#E9E3DA 100%) !important;gap:0 !important}#gate .gm{display:flex;flex-direction:column;align-items:center;gap:22px;animation:gateIn .9s cubic-bezier(.2,.8,.2,1) both}#gate .m{width:124px;height:124px;animation:none !important;box-shadow:0 18px 40px -18px rgba(142,14,22,.55);transition:transform .7s cubic-bezier(.3,1.3,.5,1)}#gate .m span{font-size:46px;letter-spacing:-.02em}#gate .gt{font-family:'Manrope',sans-serif;font-weight:800;font-size:11px;letter-spacing:.42em;margin-right:-.42em;color:#141414}#gate .gbar{position:relative;width:172px;height:7px;margin-top:34px;-webkit-mask:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 60 6%27 preserveAspectRatio=%27none%27%3E%3Cpath d=%27M2.0%201.2%20L3.9%201.3%20L5.7%201.5%20L7.6%201.6%20L9.5%201.7%20L11.3%201.9%20L13.2%202.0%20L15.1%202.1%20L16.9%202.2%20L18.8%202.3%20L20.7%202.4%20L22.5%202.5%20L24.4%202.6%20L26.3%202.7%20L28.1%202.7%20L30.0%202.8%20L31.9%202.8%20L33.7%202.9%20L35.6%202.9%20L37.5%202.9%20L39.3%202.9%20L41.2%202.9%20L43.1%202.9%20L44.9%202.9%20L46.8%202.9%20L48.7%202.8%20L50.5%202.8%20L52.4%202.8%20L54.3%202.7%20L56.1%202.7%20L58.0%202.6%20L58.0%203.4%20L56.1%203.6%20L54.3%203.7%20L52.4%203.8%20L50.5%204.0%20L48.7%204.1%20L46.8%204.2%20L44.9%204.3%20L43.1%204.5%20L41.2%204.6%20L39.3%204.7%20L37.5%204.7%20L35.6%204.8%20L33.7%204.9%20L31.9%205.0%20L30.0%205.0%20L28.1%205.0%20L26.3%205.1%20L24.4%205.1%20L22.5%205.1%20L20.7%205.1%20L18.8%205.1%20L16.9%205.1%20L15.1%205.1%20L13.2%205.0%20L11.3%205.0%20L9.5%205.0%20L7.6%204.9%20L5.7%204.9%20L3.9%204.8%20L2.0%204.8Z%27/%3E%3C/svg%3E") 0 0/100% 100% no-repeat;mask:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 60 6%27 preserveAspectRatio=%27none%27%3E%3Cpath d=%27M2.0%201.2%20L3.9%201.3%20L5.7%201.5%20L7.6%201.6%20L9.5%201.7%20L11.3%201.9%20L13.2%202.0%20L15.1%202.1%20L16.9%202.2%20L18.8%202.3%20L20.7%202.4%20L22.5%202.5%20L24.4%202.6%20L26.3%202.7%20L28.1%202.7%20L30.0%202.8%20L31.9%202.8%20L33.7%202.9%20L35.6%202.9%20L37.5%202.9%20L39.3%202.9%20L41.2%202.9%20L43.1%202.9%20L44.9%202.9%20L46.8%202.9%20L48.7%202.8%20L50.5%202.8%20L52.4%202.8%20L54.3%202.7%20L56.1%202.7%20L58.0%202.6%20L58.0%203.4%20L56.1%203.6%20L54.3%203.7%20L52.4%203.8%20L50.5%204.0%20L48.7%204.1%20L46.8%204.2%20L44.9%204.3%20L43.1%204.5%20L41.2%204.6%20L39.3%204.7%20L37.5%204.7%20L35.6%204.8%20L33.7%204.9%20L31.9%205.0%20L30.0%205.0%20L28.1%205.0%20L26.3%205.1%20L24.4%205.1%20L22.5%205.1%20L20.7%205.1%20L18.8%205.1%20L16.9%205.1%20L15.1%205.1%20L13.2%205.0%20L11.3%205.0%20L9.5%205.0%20L7.6%204.9%20L5.7%204.9%20L3.9%204.8%20L2.0%204.8Z%27/%3E%3C/svg%3E") 0 0/100% 100% no-repeat;background:#E0D9CF}#gate .gbar i{position:absolute;inset:0;background:#141414;clip-path:inset(0 calc(100% - var(--p,0%)) 0 0);transition:clip-path .45s cubic-bezier(.3,.7,.3,1)}#gate #gateMsg{margin-top:14px;min-height:18px;font-family:'Manrope',sans-serif;font-weight:600;font-size:12px;color:#7A736B;max-width:300px;letter-spacing:.02em}#gate.done .m{transform:scale(1.06)}#gate.done .gbar i{background:#B3121B}#gate.static .gbar{display:none}#gate.static #gateMsg{font-size:14px;color:#141414}@keyframes gateIn{from{opacity:0;transform:translateY(10px)}}/* режим видеокарты: без пересчёта фильтров в каждом кадре */body.gl .cell.win{animation-name:flashGl}body.gl.fs .cell.win,body.gl.dark .cell.win{animation-name:flashGlD}@keyframes flashGl{0%{background:#fff}40%{background:#fff}}@keyframes flashGlD{0%{background:#fff}}body.gl .shade{backdrop-filter:none !important;-webkit-backdrop-filter:none !important}/* плитки рисует холст видеокарты: сами плитки страницы остаются (логика, касания), но невидимы */body.glt #reels{opacity:0}body.glt #fx .cell.half{vis
