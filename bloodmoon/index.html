 === тишина: поле в покое неподвижно; дышит только луна === */#app .cell.hi:not(.win):not(.dim) .g,#app .cell.lo:not(.win):not(.dim) .g{animation:none}#app .cell:not(.win) .tor{animation:none}#app .cell:not(.win) .orb:not(.wait){animation:none}.winbar.near{animation:none}/* === один акцент: старшие символы — тонкая красная рамка вместо розовой заливки === */#app .cell.hi:not(.win){background:var(--plate) !important;box-shadow:inset 0 0 0 1.5px rgba(179,18,27,.55)}body.dark #app .cell.hi:not(.win),body.fs #app .cell.hi:not(.win){background:var(--plate) !important;box-shadow:inset 0 0 0 1px rgba(255,70,80,.22)}#app .cell.hi.dim{box-shadow:inset 0 0 0 1.5px rgba(179,18,27,.18)}/* во время выигрыша всё красное вокруг поля уходит в тень — красной остаётся только комбинация */#spin,#buyBtn{transition:opacity .45s ease,filter .45s ease}body.winning #spin,body.winning #buyBtn{opacity:.38;filter:grayscale(.85)}/* === эскалация: крупный выигрыш — луна наливается кровью, сумма проявляется кистью === */body.bwx #moon{filter:saturate(1.35) brightness(1.08);box-shadow:0 0 90px rgba(179,18,27,.6),0 0 180px rgba(179,18,27,.35);transition:filter .5s ease,box-shadow .5s ease}body.bwx #board{filter:brightness(.55) saturate(.6);transition:filter .5s ease}.ov .cnt.brush{font-family:'Shippori Mincho B1',serif;font-size:58px;letter-spacing:.01em;animation:brushIn .9s cubic-bezier(.3,.6,.2,1) .25s both}@keyframes brushIn{from{clip-path:inset(-10% 100% -10% 0);opacity:.3}to{clip-path:inset(-10% 0 -10% 0);opacity:1}}.ov .bwstroke{display:block;width:min(300px,78vw);height:14px;margin:6px auto 0;overflow:visible}.ov .bwstroke path{fill:none;stroke:#B3121B;stroke-width:5;stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:1;animation:strokeIn .8s cubic-bezier(.4,0,.2,1) .7s forwards}@keyframes strokeIn{to{stroke-dashoffset:0}}/* линия удара через весь экран */.scrcut{position:fixed;height:1.5px;margin-top:-.75px;z-index:57;pointer-events:none;transform-origin:center;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95) 12%,#fff 50%,rgba(255,255,255,.95) 88%,transparent);box-shadow:0 0 6px 1px rgba(255,255,255,.8),0 0 18px 2px rgba(200,20,30,.35)}body:not(.dark):not(.fs) .scrcut{background:linear-gradient(90deg,transparent,rgba(160,10,20,.85) 12%,#B3121B 50%,rgba(160,10,20,.85) 88%,transparent);box-shadow:0 0 0 .5px rgba(255,255,255,.9),0 0 10px 1px rgba(179,18,27,.35)}.scrcut.strong{height:2px}/* === ненужные знаки растворяются в бумаге (в бонусе — в темноте), выигрыш чуть приподнимается === */html body #app .cell.dim,html body #app .cell.adim{filter:none !important;background:color-mix(in srgb,var(--plate) 45%,var(--paper) 55%) !important;box-shadow:none !important;transition:background-color calc(.65s*var(--t)) cubic-bezier(.45,0,.3,1)}html body #app .cell.dim>*,html body #app .cell.adim>*{opacity:.13 !important;filter:none !important}html body #board.hush .cell:not(.win):not(.half){filter:none !important}html body #board.hush .cell:not(.win):not(.half):not(.dim)>*{opacity:.13}body.fs #app .cell.dim,body.fs #app .cell.adim,body.dark #app .cell.dim,body.dark #app .cell.adim{background:color-mix(in srgb,var(--plate) 35%,var(--paper) 65%) !important}body.fs #app .cell.dim>*,body.fs #app .cell.adim>*,body.dark #app .cell.dim>*,body.dark #app .cell.adim>*{opacity:.16 !important}/* в ожидании тории остаются чёткими и красными */html body #app .cell.adim.tbeat,html body #app .cell.tbeat{background:var(--plate) !important}html body #app .cell.tbeat>*{opacity:1 !important}/* выигрышные плитки приподнимаются: чуть крупнее и с мягкой тенью *//* подъём выигрыша строго на месте: плитка не масштабируется (её transform — это её позиция), а «растёт» каймой своего цветаво все стороны от центра; знак внутри чуть крупнее; мягкая тень снизу */#app #reels .cell.win:not(.half){z-index:3;box-shadow:0 7px 14px rgba(90,6,10,.26),0 1px 3px rgba(90,6,10,.22);transition:box-shadow calc(.5s*var(--t)) ease,background-color calc(.32s*var(--t)) cubic-bezier(.3,0,.2,1),transform calc(.45s*var(--t)) cubic-bezier(.3,1.25,.5,1) !important}#app .cell.half.win{box-shadow:none}/* строка над полем постоянной высоты: смена текста на значки тории/множителя не сдвигает поле */body:not(.fs) .legend{height:26px;min-height:26px;max-height:26px;box-sizing:border-box;overflow:visible}/* третий тории: тории вспыхивают по цепочке; почти попадание: красный медленно гаснет */#app .cell.trig{background:var(--plate) !important}#app .cell.trig .tor{filter:drop-shadow(0 0 8px rgba(179,18,27,.55))}#app .cell.tmiss .tor{animation:tmiss 1.4s ease-out both}@keyframes tmiss{0%{filter:drop-shadow(0 0 8px rgba(179,18,27,.5));opacity:1}45%{opacity:.45;filter:none}100%{opacity:1;filter:none}}/* брызги у вайлдов гаснут, как только начинается подсветка выигрыша */#fx .bsplat.spr{transition:opacity .35s ease}body.winning #fx .bsplat.spr{opacity:0 !important}/* стекло с кровью поверх всей игры, не перехватывает касания */#glass,#glassOld{position:fixed;inset:0;z-index:19;pointer-events:none;overflow:hidden}#glass .gdrop,#glassOld .gdrop,#glass .grun,#glassOld .grun{position:absolute;filter:drop-shadow(0 1px 1px rgba(40,0,0,.25))}#glass .old{opacity:.5;transition:opacity 1.1s ease}#glass .old svg{filter:brightness(.58) saturate(.6) sepia(.25);transition:filter 1.1s ease}#glass .old .gh{opacity:0}/* ожидание тории: живые колонки — размытый крутящийся барабан */.antcol{overflow:hidden}.antcol .astrip{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;align-items:center;filter:blur(1.6px);opacity:.55}.antcol .astrip i{display:flex;align-items:center;justify-content:center;height:var(--ch);flex:0 0 var(--ch);color:var(--ink);transform:scaleY(1.35)}body.fs .antcol .astrip i{color:#F6F3EE}/* луна и края экрана дышат в такт; луна краснеет с каждой колонкой */body.abeat #moon{animation:moonbeat var(--beat,.62s) ease-in-out infinite;filter:saturate(calc(.8 + var(--mk,1) * .25)) brightness(calc(.95 + var(--mk,1) * .05))}@keyframes moonbeat{0%,100%{box-shadow:0 0 calc(30px * var(--mk,1)) rgba(179,18,27,.35)}14%{box-shadow:0 0 calc(70px * var(--mk,1)) rgba(179,18,27,.7)}28%{box-shadow:0 0 calc(34px * var(--mk,1)) rgba(179,18,27,.4)}42%{box-shadow:0 0 calc(55px * var(--mk,1)) rgba(179,18,27,.55)}}#moon{transition:top 1.1s cubic-bezier(.2,.8,.2,1),right 1.1s cubic-bezier(.2,.8,.2,1),width 1.1s cubic-bezier(.2,.8,.2,1),height 1.1s cubic-bezier(.2,.8,.2,1),box-shadow 1.2s,opacity .6s,scale .9s ease-out,filter 1.2s ease}body::after{content:'';position:fixed;inset:0;z-index:18;pointer-events:none;opacity:0;transition:opacity .6s ease;background:radial-gradient(ellipse 75% 70% at 60% 52%,transparent 45%,rgba(40,0,4,.38) 85%,rgba(30,0,3,.6) 100%)}body.abeat::after{opacity:1;animation:vigbeat var(--beat,.62s) ease-in-out infinite}@keyframes vigbeat{0%,100%{opacity:.75}14%{opacity:1}28%{opacity:.8}42%{opacity:.92}}/* === бонус: тот же минимализм === */#fshead .k.idle{color:rgba(246,243,238,.4)}body.fs #balBtn{opacity:.5;transition:opacity .5s}body.fs .sub #subR b{font-size:20px}body.fs .sub #subL{opacity:.6}/* в фриспинах ставка и нижние кнопки не нужны — уходят, не сдвигая поле; остаётся кнопка спина (пропуск) */.controls .bet,.controls .btns,#spinCost{transition:opacity .5s ease,visibility .5s}body.fs .controls .bet,body.fs .controls .btns,body.fs #spinCost{opacity:0;visibility:hidden;pointer-events:none}/* «×N» общего множителя проступает рядом с суммой и растворяется после умножения */.winbar .mulx{font-style:normal;font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:22px;color:#FF4650;margin-left:10px;display:inline-block;vertical-align:.25em;animation:mulIn .35s cubic-bezier(.2,1.4,.4,1) both}.winbar .mulx.out{animation:mulOut .4s ease-in forwards}@keyframes mulIn{from{opacity:0;transform:translateX(-8px) scale(.6)}to{opacity:1;transform:none}}@keyframes mulOut{to{opacity:0;transform:translateX(-14px) scale(.7);filter:blur(2px)}}/* бонус: сгоревшие луны тихо гаснут почти до следа; кровь читается на тёмно-красном *//* отданная или сгоревшая луна в бонусе — тонкое кольцо с тусклым значением, без заливки */#app .orb.spent,body.fs #app .orb.dead{opacity:1 !important;filter:none !important;animation:none !important}#app .orb.spent circle:first-of-type,body.fs #app .orb.dead circle:first-of-type{fill:transparent;stroke:rgba(255,70,80,.42);stroke-width:2.2;transition:fill .6s,stroke .6s}#app .orb.spent circle:nth-of-type(2),body.fs #app .orb.dead circle:nth-of-type(2){stroke:transparent}#app .orb.spent text,body.fs #app .orb.dead text{fill:rgba(246,243,238,.32)}body.fs #glass .gdrop svg,body.fs #glass .grun svg{filter:brightness(1.45) saturate(1.1) drop-shadow(0 0 1px rgba(255,235,235,.35))}body.fs .bfan.scr,body.fs #fx .bsplat,body.fs #fx .bspray,body.fs #fx .stain{filter:brightness(1.35) saturate(1.1)}body.fs .scrcut{height:2px}html body.fs #app .cell.dim>*,html body.fs #app .cell.adim>*{opacity:.1 !important}#ov .cnt.brush{color:#fff;line-height:1.05;margin-top:6px}</style>
</head>
<body>
<div id="gate"><div class="m"><span>血月</span></div><div class="bar"><i></i></div><div id="gateMsg" style="font-weight:600;max-width:300px"></div></div>

<div id="app">

  <div id="replayTag"></div>
  <div id="petals" aria-hidden="true"></div>
  <div class="mist2" aria-hidden="true"></div>
  <div class="vign" aria-hidden="true"></div>
  <div class="top">
    <div class="l"><span class="k">血月</span><span class="n">BLOOD MOON<br>SLOT</span></div>
    <div class="bal" id="balBtn" role="button" tabindex="0"><b><svg class="coin" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="#B3121B"/><circle cx="10" cy="10" r="5.5" fill="none" stroke="#fff" stroke-width="1.6" stroke-dasharray="2.2 1.6"/></svg><span id="bal">—</span></b></div>
  </div>
  <div id="fshead"><span class="lbl" data-t="totalMult"></span><div class="krow"><span class="k" id="fsMult">×0</span><span class="fsadd" id="fsAdd"></span></div></div>
  <div class="sub"><span id="subL"></span><div class="fsprog" id="fsProg"><i class="tk"></i><i class="fl"></i></div><div class="meters"><div class="tmeter"></div><div class="cmeter"></div></div><span id="subR"></span></div>
  <div class="legend"><div class="c"><i class="o"></i><span>6 × 5</span><i></i><span>MAX ×5000</span><i class="o"></i></div><div class="meters"><div class="tmeter"></div><div class="cmeter"></div><div class="ometer"></div></div></div>
  <div id="boardWrap"><div id="board"><div id="reels"></div><div id="fx"></div><div class="torBadge" id="torBadge"></div><div class="cascBadge" id="cascBadge"></div><div class="orbsum" id="orbSum"></div></div></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><mask id="mkLan" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><path d="M27 31 Q50 27 73 31 M23 43 Q50 39 77 43 M23 57 Q50 61 77 57 M27 69 Q50 73 73 69" fill="none" stroke="#000" stroke-width="2.6"/></mask>
<mask id="mkKob" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><ellipse cx="50" cy="50" rx="24" ry="37" fill="none" stroke="#000" stroke-width="2.6"/><path d="M33 32 h34 M31 42 h11 M58 42 h11 M31 58 h11 M58 58 h11 M33 68 h34" stroke="#000" stroke-width="2.2"/><rect x="42" y="44" width="16" height="12" rx="2" fill="none" stroke="#000" stroke-width="2.6"/></mask>
<mask id="mkFuji" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><path d="M33 35 L38 26 Q50 16 62 26 L67 35 L60 31 L55 38 L50 31 L45 38 L40 31 Z" fill="#000"/></mask>
<symbol id="lo4" viewBox="0 0 100 100"><path d="M47 4 h6 v8 h-6z"/><rect x="33" y="11" width="34" height="8" rx="2"/><path mask="url(#mkLan)" d="M34 19 Q14 50 34 81 L66 81 Q86 50 66 19 Z"/><rect x="33" y="81" width="34" height="8" rx="2"/><path d="M50 89 v8" stroke="currentColor" stroke-width="3"/></symbol>
<symbol id="lo5" viewBox="0 0 100 100"><path d="M6 84 Q14 52 40 34 Q62 20 82 30 Q96 38 92 54 Q88 66 76 64 Q66 62 68 52 Q70 44 79 46" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 34 Q34 44 38 52 M54 28 Q46 38 50 46" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M4 92 Q20 84 34 92 Q50 100 64 92 Q80 84 96 92" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></symbol>
<symbol id="lo6" viewBox="0 0 100 100"><rect x="28" y="4" width="13" height="28" rx="3"/><rect x="28" y="35" width="13" height="28" rx="3"/><rect x="28" y="66" width="13" height="30" rx="3"/><rect x="52" y="22" width="10" height="23" rx="3"/><rect x="52" y="48" width="10" height="23" rx="3"/><rect x="52" y="74" width="10" height="22" rx="3"/><path d="M62 46 Q74 30 94 26 Q80 40 64 48 Z"/><path d="M62 47 Q80 46 92 56 Q76 56 63 49 Z"/><path d="M28 33 Q14 24 4 26 Q14 36 28 35 Z"/></symbol>
<symbol id="lo7" viewBox="0 0 100 100"><ellipse mask="url(#mkKob)" cx="50" cy="50" rx="31" ry="45"/></symbol>
<symbol id="lo8" viewBox="0 0 100 100"><path mask="url(#mkFuji)" d="M4 84 L38 26 Q50 16 62 26 L96 84 Z"/><path d="M2 92 H98" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></symbol>
<filter id="inkBleed" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="3" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G"/></filter><radialGradient id="moonG" cx="36%" cy="32%" r="70%"><stop offset="0" stop-color="#D8222C"/><stop offset=".55" stop-color="#8E0E16"/><stop offset="1" stop-color="#4A070C"/></radialGradient></defs></svg>
  <div id="dots" aria-hidden="true"></div>
  <div class="winbar" id="winbarEl">
    <div class="wgoal" id="winGoal"><i></i><span></span></div>
    <div><span class="lbl" id="winLbl"></span><b><span id="win">0,00</span></b></div>
    <div class="chip" id="chip">×0</div>
    <button class="chip" id="shareBtn" aria-label="Share">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2v10M5 6l4-4 4 4M3 11v4h12v-4"/></svg>
    </button>
  </div>
  <div class="controls">
    <div class="row">
      <div class="bet">
        <span class="lbl" id="betLbl"></span>
        <div class="r">
          <button class="round" id="betDn" aria-label="−">−</button>
          <b id="bet">—</b>
          <button class="round" id="betUp" aria-label="+">+</button>
        </div>
      </div>
      <div class="spinWrap">
        <button id="spin" aria-label="Spin">
          <svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle id="ringC" cx="50" cy="50" r="48"/></svg>
          <svg class="spinIc" width="36" height="36" viewBox="0 0 38 38" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M31 19a12 12 0 1 1-4-9"/><path d="M28 4v7h-7"/></svg>
          <span class="stopIc" aria-hidden="true"></span>

    </div>
    <div class="btns">

      <button class="ic" id="autoBtn" aria-label="Auto"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a7 7 0 0 1 12-5M17 10a7 7 0 0 1-12 5"/><path d="M15 2v3h-3M5 18v-3h3"/></svg><span id="autoN" style="display:none;font-size:11px"></span></button>
      <button class="ic" id="turboBtn" aria-label="Turbo"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M11 2 4 11h5l-1 7 7-9h-5z"/></svg></button>
      <button class="ante" id="anteBtn"><span><span data-t="chance"></span> <small id="anteCost"></small></span><span class="sw" aria-hidden="true"></span></button>
      <button class="buy" id="buyBtn" data-t="bonus"></button>
    </div>
    <div class="foot">
      <div class="ics">
        <button class="icon-btn" id="sndBtn" aria-label="Sound">
          <svg id="sndOn" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h3l4-3v10l-4-3H3z"/><path d="M13 7.5a3.5 3.5 0 0 1 0 5M15.5 5a7 7 0 0 1 0 10"/></svg>
          <svg id="sndOff" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M3 8h3l4-3v10l-4-3H3z"/><path d="M13 8l4 4M17 8l-4 4"/></svg>
        </button>
      </div>
      <span class="info" data-t="foot"></span><button class="lnk" id="rulesBtn" data-t="rules"></button>
    </div>
  </div>
</div>
