 49.3 L24.0 49.7 L16.0 49.0 L8.0 49.6 L0.0 49.4 L1.2 50.0 L0.5 44.0 L0.9 38.0 L1.4 32.0 L0.2 26.0 L0.1 20.0 L0.4 14.0 L1.2 8.0 L1.0 2.0Z%27/%3E%3C/svg%3E") 0 0/100% 100% no-repeat;font-family:'Shippori Mincho B1',serif !important;font-size:15px !important;font-weight:800 !important;padding:11px 22px 11px 40px !important;letter-spacing:.01em;box-shadow:none !important;border-radius:0 !important;transition:transform .45s cubic-bezier(.2,.9,.25,1.15),opacity .3s,visibility 0s .45s !important}#toast:not(.ok){padding-left:22px !important}#toast:not(.ok)::before,#toast:not(.ok)::after{display:none}#toast::before{content:'';position:absolute;left:16px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--blood)}#toast::after{content:'';position:absolute;left:20.5px;top:50%;width:3px;height:6px;margin-top:-4.5px;border:solid #fff;border-width:0 1.6px 1.6px 0;transform:rotate(45deg)}#toast.on{transition:transform .45s cubic-bezier(.2,.9,.25,1.15),opacity .25s,visibility 0s !important}/* самоисключение — список действий, а не варианты выбора */#sheet .exl .mi{min-height:46px;color:#7e0b12}#sheet .exl .mi .mr{font-size:18px;color:var(--sm)}/* бонус: пульт убран, компактный спин справа от суммы фриспина; поле плавно вытягивается на освободившуюся высоту */body.fs .controls .bet,body.fs .controls .btns{display:none !important}/* в бонусе кнопки спина нет совсем: ускорить показ можно тапом по полю */body.fs .controls{display:none !important}#board{transition:height .8s cubic-bezier(.3,.75,.25,1),width .8s cubic-bezier(.3,.75,.25,1)}/* верх в бонусе не двигается: строка «спин · итого» занимает ровно место строки «6 × 5 · MAX», поле начинается там же */body.fs .sub{margin-top:12px !important;height:26px !important;min-height:26px !important;padding-top:0 !important;padding-bottom:0 !important;box-sizing:border-box}body.fs #boardWrap{margin-top:10px !important}/* строка «спин · счётчики · итого» в бонусе всегда влезает: счётчики сжимаются, итог не уезжает
