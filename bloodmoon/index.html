ate(.85)}100%{opacity:.62;filter:brightness(.55) saturate(.65)}}.bsplat.idle,.bspray.idle{animation:dryIdle 24s cubic-bezier(.15,.6,.3,1) forwards}.stain.idle{animation:stainIn .25s ease-out forwards,dryIdle 24s .25s cubic-bezier(.15,.6,.3,1) forwards}@keyframes stainIn{0%{opacity:0;transform:scale(.3)}100%{opacity:.85;transform:scale(1)}}.washbox{position:absolute;inset:0;pointer-events:none;z-index:8;clip-path:inset(-400px -400px 0 -400px);-webkit-clip-path:inset(-400px -400px 0 -400px)}.washcol{position:absolute;inset:0;pointer-events:none}.frozen,.frozen *{animation:none !important}.frozen .hl{opacity:0}.frozen .sw{clip-path:none !important;-webkit-clip-path:none !important}/* кровь может стекать за нижний край поля поверх строки выигрыша */#boardWrap{z-index:2}/* азарт: сердце луны, наезд на замедленные барабаны, нагрев каскада */#app .orb.wait{animation:orbBeat var(--pace,1s) ease-in-out infinite !important;filter:drop-shadow(0 0 calc(4px + 10px * var(--heat,0)) rgba(255,40,50,.75))}@keyframes orbBeat{0%{transform:scale(1)}14%{transform:scale(1.13)}28%{transform:scale(1)}42%{transform:scale(1.07)}70%,100%{transform:scale(1)}}#app .orb.dead{animation:none !important;opacity:.35;filter:grayscale(.6);transition:opacity .6s,filter .6s}#board{transition:background .8s,border-color .8s,box-shadow .4s,scale 1.1s cubic-bezier(.3,0,.2,1)}#board.zoom{scale:1.06}#moon{transition:top 1.1s cubic-bezier(.2,.8,.2,1),right 1.1s cubic-bezier(.2,.8,.2,1),width 1.1s cubic-bezier(.2,.8,.2,1),height 1.1s cubic-bezier(.2,.8,.2,1),box-shadow 1.1s,opacity .6s,scale .9s ease-out;scale:calc(1 + var(--heat,0) * .07)}/* ожидание бонуса: остальное поле в тени, тории бьются */#app .cell.adim{filter:brightness(.68) saturate(.6);transition:filter .35s}#app .cell.tbeat > *{animation:tbeat .62s ease-in-out infinite}@keyframes tbeat{0%,100%{transform:scale(1)}14%{transform:scale(1.14)}28%{transform:scale(1)}42%{transform:scale(1.07)}}/* цель выигрыша: тонкая полоса прогресса внизу табло и метка Pill var(--pace,1s) ease-in-out infinite}.ometer svg{display:block;width:100%;height:100%}.ometer b{font-family:'Manrope',sans-serif;font-weight:800;font-size:13px;letter-spacing:.12em;line-height:1;display:block;font-variant-numeric:tabular-nums lining-nums}.ometer.bump b{animation:tmPop .55s cubic-bezier(.2,1.5,.4,1)}@keyframes orbBeatPill{0%,100%{transform:scale(1)}14%{transform:scale(1.25)}28%{transform:scale(1)}42%{transform:scale(1.12)}}body.omHit .ometer{color:var(--blood)}body.omHit .ometer b{animation:omHit .7s ease-out}@keyframes omHit{0%{transform:scale(1.5)}100%{transform:scale(1)}}body.omDead .ometer{opacity:0}body.omDead .ometer i{color:#8a8580;animation:none}/* фриспины: «+N» рядом с общим множителем */#fshead .krow{display:flex;align-items:flex-end}.fsadd{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:22px;line-height:1;color:rgba(246,243,238,.45);margin:0 0 4px 10px;opacity:0;transition:opacity .3s,transform .4s,color .3s}.fsadd.on{opacity:1}.fsadd.bump{animation:tmPop .55s cubic-bezier(.2,1.5,.4,1)}.fsadd.hit{color:#FF4650;transform:translateX(-18px) scale(.7);opacity:0;transition:transform .45s cubic-bezier(.5,0,.8,.4),opacity .45s,color .1s}.fsadd.dead{opacity:0}/* фриспины: печать, которая перейдёт на следующий спин — красная рамка и уголок */#app .cell.stay{box-shadow:inset 0 0 0 2px #FF4650}#app .cell.stay::after{content:"";position:absolute;right:0;top:0;width:0;height:0;border-top:11px solid #FF4650;border-left:11px solid transparent;pointer-events:none}/* фриспины: строка над полем как в обычной игре — без плашек, с линией прогресса */body.fs .sub span{background:none !important;padding:0;margin:0;border-radius:0}body.fs .sub{gap:12px;font-size:10.5px;letter-spacing:.24em;font-weight:800;text-transform:uppercase;color:#F6F3EE}#subR{font-variant-numeric:tabular-nums}.fsprog{display:none;position:relative;flex:1;height:14px}body.fs .fsprog{display:block}.fsprog .tk{position:absolute;left:0;right:0;top:50%;height:5px;margin-t px #F6F3EE,0 0 12px #F6F3EE}body.fs .whint.mult{color:#FF4650;text-shadow:0 0 10px rgba(0,0,0,.7)}.dust.fxd{position:absolute;z-index:12}.dust{position:fixed;left:0;top:0;z-index:60;pointer-events:none;transform-origin:left center;box-shadow:0 0 1px rgba(60,0,0,.35)}/* кровь от катаны на весь экран; клетка с луной-множителем поверх своей крови */.bfan.scr{position:fixed;margin:-3px 0 0 -4px;z-index:55}.stain.scr{position:fixed;z-index:54;opacity:0}@keyframes scrStain{0%{opacity:0;transform:scale(.4)}8%{opacity:.95;transform:scale(1.08)}20%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1)}}#fx .bsplat.ooze .olip{transform-origin:50% 0;transform-box:fill-box}#fx .bsplat.ooze .od,#fx .bsplat.ooze .od2{transform-box:fill-box;transform-origin:50% 50%}#fx .bsplat.ooze{overflow:visible;transition:opacity .9s ease,filter .9s ease}#fx .bsplat.ooze.dry{opacity:.85 !important;filter:saturate(.8) brightness(.62)}/* строка выигрыша фиксированной высоты: появление иконок и второй комбинации не сдвигает сумму и кнопку спина */.winbar #winLbl{height:17px;min-height:17px;flex-wrap:nowrap !important;overflow:hidden;align-items:center;max-width:calc(100vw - 150px);scrollbar-width:none}.winbar #winLbl::-webkit-scrollbar{display:none}.winbar #winLbl.over{-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%);mask-image:linear-gradient(90deg,transparent,#000 14%)}.winbar #winLbl .wc{display:inline-flex;align-items:center;gap:4px;height:16px;line-height:16px;box-sizing:border-box;flex:0 0 auto}.winbar #winLbl .wc i{font-style:normal;opacity:.7}.winbar #winLbl .wc .v{font-weight:800;font-size:11px;font-family:inherit}.winbar #winLbl .wc.in{animation:wcIn calc(.45s*var(--t)) cubic-bezier(.2,.7,.3,1) both}@keyframes wcIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}.winbar #winLbl .wc .pic,.winbar #winLbl .wc svg{width:11px !important;height:11px !important;flex:0 0 11px}/* шапка фриспинов: подписи в одну строку, плашка «+N» не наезжает на общий множитель */body.fs .sub{letter-spacing:.16em}#subL,#subR{white-space:nowrap}#fshead .k.bump{transform:scale(1.12)}.fsadd{margin-left:14px !important}/* строка выигрыша: множитель бонуса и «поделиться» — в стиле поля, без красных кружков */.winbar .chip{background:transparent !important;border-radius:0 !important;box-shadow:none !important}.winbar #chip{min-width:0;height:auto;padding:0 12px;border-left:1px solid var(--line);color:var(--blood);font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:22px;letter-spacing:.02em}.winbar #shareBtn{width:40px;min-width:40px;height:40px;padding:0;background:rgba(20,20,20,.07) !important;margin-left:6px}.winbar #shareBtn svg{stroke:var(--ink)}body.fs .winbar #shareBtn,body.dark .winbar #shareBtn{background:rgba(255,255,255,.08) !important}body.fs .winbar #shareBtn svg,body.dark .winbar #shareBtn svg{stroke:#F6F3EE}body.fs .winbar #chip{color:#FF4650;border-left-color:rgba(255,255,255,.14)}/* цель над суммой не прячется под множитель и кнопку: когда они показаны — цель скрыта */.winbar:has(#chip.on) .wgoal span,.winbar:has(#shareBtn.on) .wgoal span{display:none}.wgoal span{font-family:'Manrope',sans-serif !important;font-size:10px !important;letter-spacing:.14em !important;text-transform:uppercase}/* выигрыш проявляется плавно: плитка наливается красным, остальные мягко уходят в тень — глаз успевает прочитать комбинацию */html body #app .cell.win{animation:none !important;transition:transform calc(.32s*var(--t)) cubic-bezier(.3,1.25,.5,1),opacity .25s,background-color calc(.65s*var(--t)) cubic-bezier(.45,0,.3,1) !important}#app .cell .g,#app .cell > *{transition:color calc(.65s*var(--t)) cubic-bezier(.45,0,.3,1),opacity calc(.65s*var(--t)) cubic-bezier(.45,0,.3,1),filter calc(.65s*var(--t)) ease}/* вайлд от кровавой луны всегда поверх крови: кровь растекается из-под него, знак остаётся чистым */#app #reels .cell.bloodseal{z-index:8}/* === тишина: поле в покое неподвижно; дышит только луна === */#app .cell.hi:not(.
