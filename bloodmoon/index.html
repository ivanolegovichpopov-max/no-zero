od)}.winbar .lblghost{position:absolute;pointer-events:none;height:17px;overflow:hidden;display:flex;align-items:center;flex-wrap:nowrap;font-size:10px}.winbar #winLbl .wc .mi{display:inline-flex;width:9px;height:9px}.winbar #winLbl .wc .mi svg{width:9px;height:9px}.winfly{position:fixed;z-index:40;pointer-events:none;font-family:'Shippori Mincho B1',serif;font-weight:800;line-height:1.1;color:var(--ink);transform-origin:left center}.winbar #winLbl .wc .pic,.winbar #winLbl .wc svg{width:11px !important;height:11px !important;flex:0 0 11px}.winbar b{display:block;font-family:'Shippori Mincho B1',serif;font-size:30px;font-weight:800;line-height:1.1}#win{display:inline-block}#win.bump{animation:wb .35s ease-out}/* цель — красная нить по верхней линии стола */.wgoal{position:absolute;left:0;right:0;top:-1px;height:1.5px;pointer-events:none;opacity:0;transition:opacity .4s}.wgoal.on{opacity:1}.wgoal i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--blood);transition:width .35s ease-out}.wgoal span{position:absolute;right:2px;top:9px;font-family:'Manrope',sans-serif;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--blood);opacity:.85;white-space:nowrap;transform-origin:right center}.wgoal.hit span{animation:goalHit .7s ease-out}.winbar:has(#chip.on) .wgoal span,.winbar:has(#shareBtn.on) .wgoal span{display:none}.chip{display:none;align-items:center;justify-content:center;border:none;background:none}.chip.on{display:flex}.winbar #chip{padding:0 0 0 12px;border-left:1px solid var(--line);color:var(--blood);font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:22px}.winbar #shareBtn{width:40px;height:40px;padding:0;margin-left:6px;color:var(--ink)}.winbar #shareBtn svg{stroke:currentColor}.winbar .mulx{font-style:normal;font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:22px;color:#FF4650;margin-left:10px;display:inline-block;vertical-align:.25em;animation:mulIn .35s cubic-bezier(.2,1.4,.4,1) both}.winbar .mulx.out{animation:mulOut .4s ease-in forwards}/* стол */.controls{position:relative;z-index:1;flex:1 1 auto;display:flex;flex-direction:column;justify-content:space-evenly;gap:10px;padding:6px var(--edge) 6px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}/* ставка — сумма и линейка; свайп влево-вправо меняет ставку */.bet{display:flex;flex-direction:column;gap:2px;flex:1;max-width:230px;touch-action:pan-y;user-select:none;-webkit-user-select:none}.bet .lbl{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}.bet .r{display:flex;align-items:center;justify-content:space-between}.bet #bet{font-family:'Shippori Mincho B1',serif;font-size:27px;font-weight:800;min-width:100px;text-align:center;cursor:pointer;transition:transform .15s}.bet #bet.tick{animation:betTick .22s ease-out}@keyframes betTick{40%{transform:translateY(-2px) scale(1.04)}}.round{width:38px;height:38px;border:none;background:none;color:var(--muted);font-size:22px;font-weight:400;padding:0}.round:active{color:var(--blood);transform:scale(.9)}.ruler{position:relative;height:13px;margin:1px 6px 0;display:flex;justify-content:space-between;align-items:flex-start;border-top:1px solid var(--line)}.ruler i{width:1px;height:4px;background:var(--line);transition:height .2s,background .2s}.ruler i.big{height:7px}.ruler i.on{width:2px;height:11px;background:var(--blood)}/* спин — энсо: круг кистью; во время раунда круг дорисовывается и стирается */.spinWrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px}#spin{position:relative;width:96px;height:96px;border:none;border-radius:50%;padding:0;background:none;color:var(--blood);display:flex;align-items:center;justify-content:center;transition:transform .15s,opacity .45s ease,filter .45s ease;touch-action:manipulation;-webkit-touch-callout:none;user-select:none}#app.short #spin{width:84px;height:84px}#spin:active{transform:scale(.94)}#spin .enso{positio
