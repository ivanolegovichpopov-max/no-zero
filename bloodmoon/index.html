imation:dryIdle 24s cubic-bezier(.15,.6,.3,1) forwards}.stain.idle{animation:stainIn .25s ease-out forwards,dryIdle 24s .25s cubic-bezier(.15,.6,.3,1) forwards}@keyframes stainIn{0%{opacity:0;transform:scale(.3)}100%{opacity:.85;transform:scale(1)}}.washbox{position:absolute;inset:0;pointer-events:none;z-index:8;clip-path:inset(-400px -400px 0 -400px);-webkit-clip-path:inset(-400px -400px 0 -400px)}.washcol{position:absolute;inset:0;pointer-events:none}.frozen,.frozen *{animation:none !important}.frozen .hl{opacity:0}.frozen .sw{clip-path:none !important;-webkit-clip-path:none !important}/* кровь может стекать за нижний край поля поверх строки выигрыша */#boardWrap{z-index:2}/* азарт: сердце луны, наезд на замедленные барабаны, нагрев каскада */#app .orb.wait{animation:orbBeat var(--pace,1s) ease-in-out infinite !important;filter:drop-shadow(0 0 calc(4px + 10px * var(--heat,0)) rgba(255,40,50,.75))}@keyframes orbBeat{0%{transform:scale(1)}14%{transform:scale(1.13)}28%{transform:scale(1)}42%{transform:scale(1.07)}70%,100%{transform:scale(1)}}#app .orb.dead{animation:none !important;opacity:.35;filter:grayscale(.6);transition:opacity .6s,filter .6s}#board{transition:background .8s,border-color .8s,box-shadow .4s,scale 1.1s cubic-bezier(.3,0,.2,1)}#board.zoom{scale:1.06}#moon{transition:top 1.1s cubic-bezier(.2,.8,.2,1),right 1.1s cubic-bezier(.2,.8,.2,1),width 1.1s cubic-bezier(.2,.8,.2,1),height 1.1s cubic-bezier(.2,.8,.2,1),box-shadow 1.1s,opacity .6s,scale .9s ease-out;scale:calc(1 + var(--heat,0) * .07)}/* ожидание бонуса: остальное поле в тени, тории бьются */#app .cell.adim{filter:brightness(.68) saturate(.6);transition:filter .35s}#app .cell.tbeat > *{animation:tbeat .62s ease-in-out infinite}@keyframes tbeat{0%,100%{transform:scale(1)}14%{transform:scale(1.14)}28%{transform:scale(1)}42%{transform:scale(1.07)}}/* цель выигрыша: тонкая полоса прогресса внизу табло и метка следующего порога */.wgoal{position:absolute;left:0;right:0;bottom:0;height:3px;pointer-events:none;opacity:0;transition:opacity .4s}.wgoal.on{opacity:1}.wgoal i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--blood);transition:width .35s ease-out}.wgoal span{position:absolute;right:10px;bottom:auto;top:-49px;font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:12px;letter-spacing:.06em;color:var(--blood);opacity:.85}.wgoal.hit span{animation:goalHit .7s ease-out}@keyframes goalHit{0%{transform:scale(1.8);opacity:1}100%{transform:scale(1)}}.winbar.near{animation:near .14s linear infinite}@keyframes near{0%{translate:0 0}25%{translate:.8px -.5px}50%{translate:-.8px .4px}75%{translate:.5px .5px}100%{translate:0 0}}/* облегчённый режим для слабых телефонов: без размытий и наездов, меньше теней */body.lite .bsplat,body.lite .bspray,body.lite .stain{filter:none !important}body.lite #board.zoom{scale:1}body.lite .vign{display:none}body.lite #app .orb.wait{filter:none}body.lite .winbar.near{animation:none}.ctabs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #141414;margin:0 0 14px}.ctabs button{height:42px;border:none;background:transparent;font-weight:800;font-size:13px;letter-spacing:.06em}.ctabs button+button{border-left:1px solid #141414}.ctabs button.on{background:#141414;color:#fff}.clog{width:100%;border-collapse:collapse;font-size:13px;color:#141414}.clog td{padding:10px 0;border-bottom:1px solid rgba(20,20,20,.12);vertical-align:top;line-height:1.45}.clog a{color:var(--blood);font-weight:800}/* сумма лун — третий счётчик строки над полем */.ometer{display:none;align-items:center;gap:6px;order:3;color:var(--ink);transition:opacity .5s,color .3s}body.omOn .ometer{display:flex}body.omOn .legend .c{opacity:0}body.omOn.tmOn .ometer,body.omOn.cmOn .ometer{border-left:1px solid var(--ink);padding-left:14px;border-left-color:rgba(20,20,20,.3)}.ometer i{display:block;width:9px;height:9px;color:var(--blood);animation:orbBeatPill var(--pace,1s) ease-in-out infinite}.ometer svg{display:block;width:100%;height:100%}.o
