e:20px;font-weight:800;color:#B3121B}.field{display:flex;gap:8px;align-items:center;margin:6px 0}.field input{flex:1;height:46px;border:1px solid #141414;background:#fff;font:inherit;font-size:16px;padding:0 10px;min-width:0}.note{font-size:12px;color:#5A5650}h4{margin:18px 0 4px;font-size:13px;letter-spacing:.08em}#toast{position:fixed;left:50%;top:calc(var(--sat) + 18px);transform:translate(-50%,calc(-100% - var(--sat) - 40px));opacity:0;visibility:hidden;background:#141414;color:#F6F3EE;padding:10px 16px;font-size:13px;font-weight:600;z-index:60;transition:transform .3s,opacity .3s,visibility 0s .3s;max-width:90%;text-align:center}#toast.on{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .3s,opacity .2s,visibility 0s}#gate{position:fixed;inset:0;background:#F6F3EE;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px;text-align:center;transition:opacity .5s}#gate .m{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 38% 36%,#D41E28 0,#B3121B 45%,#8E0E16 100%);display:flex;align-items:center;justify-content:center;animation:breathe 1.6s ease-in-out infinite}#gate .m span{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:44px;color:#fff}#gate .bar{width:140px;height:2px;background:#E2DCD3;overflow:hidden}#gate .bar i{display:block;height:100%;width:40%;background:#141414;animation:load 1.1s ease-in-out infinite}@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(250%)}}#gate.hide{opacity:0;pointer-events:none}#gate.static .bar{display:none}.flyorb{position:fixed;left:0;top:0;z-index:18;pointer-events:none}.ov .cnt{font-family:'Manrope',sans-serif;font-weight:800;font-size:54px;line-height:1;color:#fff;margin-top:10px;font-variant-numeric:tabular-nums}.ov .tier{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:72px;line-height:1;color:#FF4650;transition:transform .25s}.ov .hint{font-size:11px;letter-spa ак --- */#app::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}.mist2{position:absolute;left:0;right:0;bottom:0;height:46%;pointer-events:none;z-index:0;background:linear-gradient(180deg,transparent,rgba(179,18,27,.06) 45%,rgba(179,18,27,.13))}body:not(.dark):not(.fs) .mist2{background:linear-gradient(180deg,transparent,rgba(179,18,27,.035) 50%,rgba(179,18,27,.07))}/* луна крупнее и ниже — заполняет верх, со свечением-ореолом */#moon{box-shadow:0 0 90px 10px rgba(179,18,27,.28)}/* --- шапка --- */.top{padding:6px 16px 0}.top .l{background:transparent}.bal{border-radius:0 !important;background:var(--paper) !important;border:1px solid var(--line)}.bal b{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:20px;gap:9px}.bal .coin{display:none}.bal b::before{display:grid;color:#fff;font-size:12px;font-weight:800;border-radius:3px;box-shadow:0 0 10px rgba(179,18,27,.35)}/* линейка-заголовок над полем: заполняет пустоту информацией */.legend{position:relative;z-index:1;display:flex;font-weight:800}.legend::before,.legend::after{background:var(--line)}.legend i{letter-spacing:0}/* --- поле: одна рама, засечки по углам --- */#board{border:1px solid var(--line)}body:not(.dark):not(.fs) .cell{background:#fff}/* --- выигрыш: та же рама, цифры минчо --- *//* --- управление: квадраты вместо кругов и пилюль --- */.lbl{letter-spacing:.24em}/* спин: остаётся красным кругом, кольцо — мазок энсо */#board{padding:7px}body.dark .cell{background:#1A1615}body.dark #board,body.fs #board{background:#110F0E !important}/* во время прокрутки: тёмный круг, светлый стоп — без белого пятна *//* =====
